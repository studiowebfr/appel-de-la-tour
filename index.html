/* ---------- Registre des morts : la mort reste définitive même en important une ancienne sauvegarde ---------- */
const DEADK='appel-tour-dead';let deadPushed='';
function deadLocal(){try{const a=JSON.parse(localStorage.getItem(DEADK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function deadStore(a){try{localStorage.setItem(DEADK,JSON.stringify(a.slice(-1500)))}catch(e){}}
function ensureSid(){
  if(S.sid)return;
  const all=[...(S.heroes||[]),...(S.fallen||[]).map(f=>f.hero).filter(Boolean)].filter(h=>h&&h.id!=null&&h.id<=6).sort((a,b)=>a.id-b.id);
  S.sid=all.length?'L'+Math.abs(hash(all.map(h=>h.id+'-'+h.seed).join('|'))).toString(36):'N'+Math.floor(Math.random()*1e12).toString(36);
}
const heroKey=h=>S.sid+':'+h.id;
function deadAdd(keys){if(!keys.length)return;const a=deadLocal();keys.forEach(k=>{if(!a.includes(k))a.push(k)});deadStore(a);deadPush()}
function deadMine(){const p=S.sid+':';return deadLocal().filter(k=>k.startsWith(p))}
async function deadPush(){
  if(!S||PV.status!=='online'||!PV.canWrite||!PV.uid||!PV.db)return;
  const list=deadMine().slice(-300),sig=JSON.stringify(list);if(!list.length||sig===deadPushed)return;deadPushed=sig;
  const ref=PV.db.collection('drafts').doc(PV.uid),mine=PV.docs.find(x=>x.id===PV.uid);
  try{if(mine)await ref.update({dead:list});else await ref.set({dead:list,sp:0,day:null,draft:null,p:(S.settings&&S.settings.name)||null})}catch(e){deadPushed=''}
}
function enforceDead(){
  if(!S||!Array.isArray(S.heroes))return 0;ensureSid();
  const p=S.sid+':',keys=new Set(deadLocal().filter(k=>k.startsWith(p)));
  if(PV&&PV.status==='online')PV.docs.forEach(d=>{if(Array.isArray(d.dead))d.dead.forEach(k=>{if(typeof k==='string'&&k.startsWith(p))keys.add(k)})});
  (S.fallen||[]).forEach(f=>{if(f.hero&&f.hero.id!=null)keys.add(heroKey(f.hero))});
  const gone=S.heroes.filter(h=>keys.has(heroKey(h)));
  if(gone.length){
    const ids=gone.map(h=>h.id);
    gone.forEach(h=>{if(!(S.fallen||[]).some(f=>f.hero&&f.hero.id===h.id)){S.fallen=S.fallen||[];S.fallen.unshift({name:h.name,cls:h.cls,stars:h.stars,lvl:h.lvl,awk:h.awk,leg:h.leg||null,seed:h.seed,el:h.el,where:'Mort déjà enregistrée',killer:'le destin',at:Date.now(),hero:JSON.parse(JSON.stringify(h))})}});
    ids.forEach(id=>{unequipAll(id);removeFromTeam(id)});S.heroes=S.heroes.filter(h=>!ids.includes(h.id));
    if(ids.includes(sheetId)){sheetId=null;pickSlot=null}if(ids.includes(selHero))selHero=null;if(ids.includes(fuseTarget))fuseTarget=null;
  }
  const a=deadLocal(),n0=a.length;keys.forEach(k=>{if(!a.includes(k))a.push(k)});if(a.length!==n0)deadStore(a);
  return gone.length;
}
function deadCheck(){const n=enforceDead();deadPush();if(n){save();if(!busy)render();toast(`${n} héros déjà tombé${n>1?'s':''} ${n>1?'ont':'a'} rejoint le Mémorial : la mort est définitive, même en important une sauvegarde.`)}}

function casualties(res,sum,where){
  res.U.filter(u=>u.side==='h').forEach(u=>{
    const h=heroById(u.id);h.hp=Math.min(stats(h).hp,Math.round(u.hp/(u.hpMul||1)));
    if(!u.alive){sum.fallen.push(h.name);S.fallen.unshift({name:h.name,cls:h.cls,stars:h.stars,lvl:h.lvl,awk:h.awk,leg:h.leg||null,seed:h.seed,el:h.el,where,killer:u.killer,at:Date.now(),hero:JSON.parse(JSON.stringify(h))})}
  });
  const dead=res.U.filter(u=>u.side==='h'&&!u.alive).map(u=>u.id);
  ensureSid();deadAdd(dead.map(id=>S.sid+':'+id));
  dead.forEach(id=>{unequipAll(id);removeFromTeam(id)});
  S.heroes=S.heroes.filter(h=>!dead.includes(h.id));
  if(dead.includes(fuseTarget))fuseTarget=null;
  if(dead.includes(selHero))selHero=null;
  if(dead.includes(sheetId)){sheetId=null;pickSlot=null}
}
function grantXp(party,xp,sum){
  party.forEach(h=>{
    if(!heroById(h.id))return;
    const before=h.lvl;h.xp+=xp;
    while(h.lvl<capOf(h)&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);levelUp(h)}
    if(h.lvl>=capOf(h))h.xp=0;
    if(h.lvl>before)sum.levels.push(`${h.name} → niv. ${h.lvl}`);
    const mx=stats(h).hp;h.hp=Math.min(mx,h.hp+Math.round(mx*.15));
  });
}
const isManual=()=>!!(S.settings&&S.settings.manual);
function startBattle(party,foes,slots,sum,after,mode){
  if(isManual()){const B=battleNew(party,foes,slots,25,{manual:true});B.step();lastBattle={res:B,sum,idx:0,done:false,mode,after,sel:0}}
  else{const res=simulate(party,foes,slots);after(res);save();lastBattle={res,sum,idx:0,done:false,mode}}
  busy=true;render();play();
}
function climb(){
  if(busy)return;
  if(S.floor>TOWER_MAX)return toast('Vous avez terminé la Tour principale !');
  const party=partyHeroes().filter(h=>h.hp>0);
  if(!party.length)return toast('Aucun héros en état de combattre dans l’équipe.');
  const f=S.floor;seeFoes(S.foes,`Tour, étage ${f}`);
  const sum={floor:f,win:false,fallen:[],levels:[],gems:0,gold:0,loot:[]};
  startBattle(party,S.foes,S.slots,sum,res=>{sum.win=res.win;
  casualties(res,sum,`Étage ${f}`);
  if(res.win){rareDrop(sum);
    const boss=f%10===0;if(boss)sum.tomes=giveTomes(1);
    sum.gems=20+f*2+(boss?100:0);sum.gold=(50+f*12+(boss?150:0))*goldMul();
    S.gems+=sum.gems;S.gold+=sum.gold;
    grantXp(party,20+f*6,sum);track('climb');if(f%10===0&&!(S.storyRead&&S.storyRead[Math.min(STORY.length-1,f/10)]))S.storyPending=Math.min(STORY.length-1,f/10);
    S.floor++;S.best=Math.max(S.best,f);
    if(f>=TOWER_MAX){S.gems+=1000;S.gold+=10000;S.shards+=100;sum.gems+=1000;sum.gold+=10000;sum.shards=100;sum.done='Tour principale terminée ! Récompense finale : +1 000 cristaux, +10 000 or et +100 éclats d’étoile.'}
    S.foes=S.floor>TOWER_MAX?[]:genFoes(S.floor);
  }},'tower');
}

/* ---------- Équipement ---------- */
function rollSub(k,tier,rar){const [lo,hi]=SUBR[k];let v=lo+R()*(hi-lo);if(TIERED.has(k))v*=tmul(tier);if(rar===6)v*=1.2;return Math.max(1,Math.round(v))}
function addSub(it){const opts=SUBPOOL.filter(k=>k!==it.main&&!it.subs.some(x=>x.k===k));const k=pick(opts);it.subs.push({k,v:rollSub(k,it.tier,it.rar),n:1})}
function makeItem(slot,rar,tier,set){
  const sl=SLOT[slot],it={id:S.nextItem++,slot,rar,tier,plus:0,main:pick(sl.main),subs:[],by:null,name:`${pick(sl.names)} ${pick(SUFFIX)}`,set:set||pick(STATSETS)};
  for(let i=0;i<Math.min(4,rar-1);i++)addSub(it);
  return it;
}
const itemById=id=>S.inv.find(i=>i.id===id);
const gearOf=h=>S.inv.filter(i=>i.by===h.id);
function unequipAll(hid){S.inv.forEach(i=>{if(i.by===hid)i.by=null})}
function withRatio(h,fn){if(!h){fn();return}const m0=stats(h).hp,r=m0?h.hp/m0:1;fn();const m1=stats(h).hp;h.hp=Math.max(h.hp>0?1:0,Math.min(m1,Math.round(r*m1)))}
function equip(id){
  const it=itemById(id),h=heroById(sheetId);if(!it||!h)return;
  if(busy)return toast('Attendez la fin du combat.');
  const prev=it.by!=null?heroById(it.by):null;
  if(prev&&prev!==h)withRatio(prev,()=>{it.by=null});
  withRatio(h,()=>{const cur=S.inv.find(i=>i.by===h.id&&i.slot===it.slot);if(cur&&cur!==it)cur.by=null;it.by=h.id});
  track('equip');pickSlot=null;save();render();toast(`${h.name} équipe ${it.name}.`);
}
function unequip(id){const it=itemById(id);if(!it)return;if(busy)return toast('Attendez la fin du combat.');withRatio(heroById(it.by),()=>{it.by=null});save();render()}
function enhance(id){
  const it=itemById(id);if(!it)return;
  if(busy)return toast('Attendez la fin du combat.');
  if(it.plus>=MAXPLUS)return toast('Cette pièce est déjà à +15.');
  const c=enhCost(it);if(S.gold<c)return toast('Pas assez d’or.');
  S.gold-=c;let msg='';track('enhance');
  withRatio(it.by!=null?heroById(it.by):null,()=>{
    it.plus++;
    if(it.plus%3===0){
      if(it.subs.length<4){addSub(it);const x=it.subs[it.subs.length-1];msg=` Nouvelle stat : ${STAT[x.k]} ${fmt(x.k,x.v)}.`}
      else{const x=pick(it.subs),v=rollSub(x.k,it.tier,it.rar);x.v+=v;x.n++;msg=` ${STAT[x.k]} ${fmt(x.k,v)}.`}
    }
  });
  save();render();toast(`${it.name} passe à +${it.plus}.${msg}`);
}
function sellItem(id){
  const it=itemById(id);if(!it||it.by!=null)return;
  if(pendingSell!==id){pendingSell=id;render();setTimeout(()=>{if(pendingSell===id){pendingSell=null;render()}},3000);return}
  pendingSell=null;const v=sellValue(it);S.gold+=v;S.inv=S.inv.filter(i=>i!==it);save();render();toast(`${it.name} vendu (+${v} or).`);
}

/* Recyclage rapide : vend d'un coup les pièces non portées des rangs choisis */
let recSel=new Set([1,2]),recKeep=true,recAsk=false,recOpen=false;
const recList=()=>S.inv.filter(i=>i.by==null&&recSel.has(i.rar)&&(!recKeep||!i.plus));
function recycle(){
  const L=recList();if(!L.length)return toast('Aucune pièce à recycler avec ces critères.');
  if(!recAsk){recAsk=true;render();setTimeout(()=>{if(recAsk){recAsk=false;render()}},4000);return}
  recAsk=false;const v=L.reduce((t,i)=>t+sellValue(i),0),ids=new Set(L.map(i=>i.id));S.gold+=v;S.inv=S.inv.filter(i=>!ids.has(i.id));sfx('loot');save();render();
  toast(`${L.length} pièce${L.length>1?'s':''} recyclée${L.length>1?'s':''} : +${fmtN(v)} or.`);

function renderRecycle(){

    <button class="btn ${recAsk?'warn':'prime'}" data-act="recgo" ${L.length&&!busy?'':'disabled'}>${recAsk?`Confirmer : recycler ${L.length} pièce${L.length>1?'s':''}`:`Recycler ${L.length} pièce${L.length>1?'s':''} · +${fmtN(v)} or`}</button>

/* ---------- Donjons ---------- */
function tickEnergy(){
  if(!S)return;const now=Date.now();
  if(S.energy>=ENERGY_MAX){S.energyT=now;return}
  const g=Math.floor((now-S.energyT)/EN_MS);
  if(g>0){S.energy=Math.min(ENERGY_MAX,S.energy+g);S.energyT+=g*EN_MS;if(S.energy>=ENERGY_MAX)S.energyT=now}
}
function lootWeights(L){const w6=L>=7?(L-6)*.6:0,w5=1+.8*L,w4=4+1.6*L,w3=14+2*L,w2=30;return[100-w2-w3-w4-w5-w6,w2,w3,w4,w5,w6]}
function rollRar(L){const w=lootWeights(L);let r=R()*100;for(let i=5;i>=0;i--){if(r<w[i])return i+1;r-=w[i]}return 1}
const dunGold=L=>60+L*35;
const foesPower=f=>Math.round(f.reduce((t,x)=>t+x.hp*.5+x.atk*4+x.def*3,0));
/* Difficulté des donjons : équivalent d'étage de la Tour (le coffre-fort d'or reste plus doux) */
const dunEq=(k,L)=>k==='tresor'?L*10-5:k==='necropole'?L*18-2:L*18-8;
function genDunFoes(k,L){
  const d=DUNGEONS.find(x=>x.k===k),fe=[randEl(),randEl()],eq=dunEq(k,L),sc=scHard(scMain(eq));
  const foes=d.foes.map(n=>{const t=FOES.find(x=>x.n===n);return{n:t.n,hp:Math.round(t.hp*sc),atk:Math.round(t.atk*sc),def:Math.round(t.def*sc),spd:t.spd,el:pick(fe),lv:eq}});
  foes.push({n:d.boss,hp:Math.round(200*sc),atk:Math.round(13*sc),def:Math.round(5*sc),spd:9,boss:true,el:fe[0],lv:eq});
  return foes;
}
const DUN_ROT=['armurerie','joyaux','necropole','tresor','astres'];
const dunFeat=()=>DUN_ROT[((dayIdx()%DUN_ROT.length)+DUN_ROT.length)%DUN_ROT.length];
function dunFoes(k){const L=S.dunSel[k];if(!S.dunFoes[k]||S.dunFoes[k].lvl!==L)S.dunFoes[k]={lvl:L,foes:genDunFoes(k,L)};return S.dunFoes[k].foes}
function runDungeon(k){
  if(busy)return;tickEnergy();
  const d=DUNGEONS.find(x=>x.k===k);if(!d)return;
  const L=S.dunSel[k],party=partyHeroes().filter(h=>h.hp>0);
  if(!party.length)return toast('Aucun héros en état de combattre dans l’équipe.');
  if(S.energy<energyCost())return toast('Pas assez d’énergie. Elle remonte de 3 toutes les 2 minutes ; les missions du jour en donnent aussi.');
  S.energy-=energyCost();track('dungeon');
  seeFoes(dunFoes(k),d.n);const label=`${d.n} niv. ${L}`;
  const sum={label,win:false,fallen:[],levels:[],gems:0,gold:0,loot:[],sold:0};
  startBattle(party,dunFoes(k),S.slots,sum,res=>{sum.win=res.win;
  casualties(res,sum,label);
  if(res.win){rareDrop(sum);
    const feat=dunFeat()===k?2:1;if(feat>1)sum.feat=true;
    sum.gold=Math.round((d.type==='gold'?goldDunBase(L)*(.9+R()*.2)*feat:dunGold(L))*goldMul());S.gold+=sum.gold;
    grantXp(party,15+L*10,sum);
    if(d.type==='gear'){
      const n=(1+(R()<.55?1:0)+(R()<.08*L?1:0)+(evBonus('dunloot')?1:0))*feat;
      for(let i=0;i<n;i++){const it=makeItem(pick(d.slots),rollRar(L),L,pick(d.sets));if(S.inv.length>=INV_MAX){sum.sold+=sellValue(it);S.gold+=sellValue(it)}else{S.inv.push(it);sum.loot.push(it.id)}}
    }
    if(d.type==='shard'){sum.shards=Math.round(shardBase(L)*(.85+R()*.3))*shardMul()*feat;S.shards+=sum.shards}
    if(L===S.dun[k]&&L<DUN_MAX){S.dun[k]=L+1;sum.unlock=L+1}
  }
  S.dunFoes[k]=null;
  },'dungeon');
}
function levelUp(h){const old=stats(h).hp;h.lvl++;h.hp+=stats(h).hp-old}

let timer=null,speed=1;
function applyEnd(b){if(b&&b.after&&!b.applied&&b.res.over){b.applied=true;b.after(b.res);save()}}
function play(){
  clearTimeout(timer);

function floatNum(k,txt,cls){const t=document.getElementById('tk'+k);if(!t)return;const f=document.createElement('span');f.className='fnum '+cls;f.textContent=txt;t.appendChild(f);setTimeout(()=>f.remove(),950)}
function pulse(k,cls){const t=document.getElementById('ur'+k);if(!t)return;t.classList.remove(cls);void t.offsetWidth;t.classList.add(cls)}
function showEvent(i){

function updUnit(k,hp,max,a,x){

function bAct(choice){const b=bWait();if(!b)return;if(b.rta){rtaMove(choice);return}b.res.step(choice);b.sel=0;bctlRefresh();play()}
function bTarget(k){const b=bWait();if(!b)return;if(!b.res.canTarget(b.sel,k))return;const s=b.res.U[b.res.wait].sk[b.sel];bAct({i:b.sel,t:s.tg==='n'?null:k})}
function bAuto(){const b=lastBattle;if(!b||b.done||!b.res.step||b.res.over||b.rta)return;b.res.setAuto();bctlRefresh();play()}
function finish(){clearTimeout(timer);if(!lastBattle)return;if(lastBattle.res.step&&!lastBattle.res.over){lastBattle.idx=lastBattle.res.ev.length;render();bctlRefresh();return}applyEnd(lastBattle);if(!lastBattle.done&&!lastBattle.sndEnd&&document.getElementById('blog')){lastBattle.sndEnd=true;sfx(lastBattle.res.win?'win':'lose')}lastBattle.done=true;lastBattle.idx=lastBattle.res.ev.length;busy=false;render();if(S.storyPending!=null){const k=S.storyPending;S.storyPending=null;save();setTimeout(()=>showStory(k),400)}}

function rest(){
  const hurt=S.heroes.some(h=>h.hp<stats(h).hp);
  if(!hurt)return toast('Tous vos héros sont déjà en pleine forme.');
  const c=restCost();if(S.gold<c)return toast('Pas assez d’or pour l’auberge.');

/* ---------- Héros ---------- */
function toggleParty(id){
  if(busy)return;
  if(S.slots.includes(id))removeFromTeam(id);
  else if(!placeAuto(id))return toast('L’équipe compte déjà 5 héros.');
  save();render();
}
function pickHero(id){if(busy)return;selHero=selHero===id?null:id;render()}
function clickSlot(i){
  if(busy)return;
  const sl=slotsOf(fkey);
  if(selHero!=null&&!heroById(selHero))selHero=null;
  const occ=sl[i];
  if(selHero==null){if(occ){selHero=occ;render()}return}
  if(fkey!=='main'&&heroById(selHero).el!==fkey){selHero=null;render();return toast(`Seuls les héros ${ELEM[fkey].n} peuvent entrer dans cette tour.`)}
  const j=sl.indexOf(selHero);
  if(j>=0){sl[j]=occ;sl[i]=selHero}
  else{if(!occ&&sl.filter(Boolean).length>=5)return toast('5 héros maximum : retirez-en un d’abord.');sl[i]=selHero}
  selHero=null;syncParty();save();render();
}
function unslot(i){if(busy)return;const sl=slotsOf(fkey),id=sl[i];if(!id)return;sl[i]=null;if(selHero===id)selHero=null;syncParty();save();render()}
function train(id){
  const h=heroById(id);if(!h||busy)return;
  if(h.lvl>=capOf(h))return toast(`${h.name} a atteint son niveau maximal (${capOf(h)}). Faites-le monter en étoiles pour aller plus haut.`);
  const c=trainCost(h);if(S.gold<c)return toast(`Pas assez d’or : il faut ${c} or.`);
  S.gold-=c;h.xp=0;levelUp(h);sfx('coin');save();render();toast(`${h.name} passe au niveau ${h.lvl}.`);
}
const materialsFor=h=>S.heroes.filter(x=>x.id!==h.id&&!x.leg&&x.cls===h.cls&&x.stars===h.stars);
const canFuse=h=>!h.leg&&h.stars<4&&materialsFor(h).length>0;
function startFuse(id){if(busy)return;fuseTarget=fuseTarget===id?null:id;render();if(fuseTarget)window.scrollTo({top:0,behavior:'smooth'})}
function fuse(mid){
  const t=heroById(fuseTarget),m=heroById(mid);
  if(!t||!m||busy||!materialsFor(t).includes(m))return;
  const c=fuseCost(t);if(S.gold<c)return toast('Pas assez d’or pour la fusion.');
  S.gold-=c;t.stars++;t.lvl=Math.max(t.lvl,m.lvl);t.xp=0;t.hp=stats(t).hp;
  unequipAll(mid);removeTrain(mid);S.heroes=S.heroes.filter(x=>x.id!==mid);removeFromTeam(mid);
  fuseTarget=null;save();render();toast(`Fusion réussie : ${t.name} passe à ${t.stars}★ !`);
}
function dismiss(id){
  if(busy)return;
  if(pendingDismiss!==id){pendingDismiss=id;render();setTimeout(()=>{if(pendingDismiss===id){pendingDismiss=null;render()}},3000);return}
  const h=heroById(id);pendingDismiss=null;if(!h)return;
  const v=dismissValue(h);
  S.gold+=v;unequipAll(id);removeTrain(id);S.heroes=S.heroes.filter(x=>x.id!==id);removeFromTeam(id);
  if(fuseTarget===id)fuseTarget=null;
  save();render();toast(`${h.name} quitte la guilde (+${v} or).`);
}
function resetGame(){
  if(!pendingReset){pendingReset=true;render();setTimeout(()=>{pendingReset=false;render()},3000);return}
  pendingReset=false;clearTimeout(timer);busy=false;lastBattle=null;lastPull=null;fuseTarget=null;sheetId=null;pickSlot=null;selHero=null;newGame();tab='home';render();toast('Nouvelle partie commencée.');
}

function claimDaily(){if(!dailyReady())return toast('Bonus déjà récupéré aujourd’hui. Revenez demain !');S.daily=today();S.gems+=150;S.gold+=100;tickEnergy();S.energy+=50;save();render();toast('Bonus du jour : +150 cristaux, +100 or et +50 énergie !')}

function hpBar(hp,max){const p=Math.round(hp/max*100);return`<div class="hp"><div class="lab"><span>PV</span><span>${hp}/${max}</span></div><div class="bar"><i class="${p<30?'low':p<60?'mid':''}" style="width:${p}%"></i></div></div>`}

/* Fusion de doublons : un autre exemplaire du même personnage, hors équipe et entraînement */
const inAnyTeam=id=>S.slots.includes(id)||Object.values(S.eslots||{}).some(a=>a&&a.includes(id));
const dupsOf=h=>h.leg?[]:S.heroes.filter(x=>x.id!==h.id&&!x.leg&&x.name===h.name&&x.cls===h.cls&&!inAnyTeam(x.id)&&!inTrain(x.id)).sort((a,b)=>a.stars-b.stars||a.lvl-b.lvl||(a.awk||0)-(b.awk||0));
let dupAsk=null;
function dupFuse(id){
  const h=heroById(id);if(!h||busy||h.leg||(h.awk||0)>=AWK_MAX)return;
  const m=dupsOf(h)[0];if(!m)return toast(`Aucun autre ${h.name} disponible (hors équipe et entraînement).`);
  if(dupAsk!==id){dupAsk=id;render();setTimeout(()=>{if(dupAsk===id){dupAsk=null;render()}},4000);return}
  dupAsk=null;
  withRatio(h,()=>{h.awk=(h.awk||0)+1});h.lvl=Math.max(h.lvl,m.lvl);
  unequipAll(m.id);removeTrain(m.id);S.heroes=S.heroes.filter(x=>x.id!==m.id);removeFromTeam(m.id);
  sfx('ult');save();render();toast(`${h.name} absorbe son doublon : ${h.awk}/${AWK_MAX} étoiles de doublon, +${h.awk*6} % PV, ATQ et DÉF.`);

function heroCard(h,mode,note,delay){
  const s=stats(h),cap=capOf(h),inP=S.party.includes(h.id),L=h.leg&&LEGENDS[h.leg];
  const style=delay!=null?` style="animation-delay:${delay}ms"`:'';

    return`<article class="hero r${h.stars}"><div class="htop"><div class="ava">${portrait(h)}</div><div style="min-width:0"><div class="hname">${h.name}</div>${starsHtml(h.stars)}</div></div>

  }
  let acts='';
  if(mode==='full'){
    const conf=pendingDismiss===h.id;
    const fuseBtn=(!h.leg&&h.stars<4)?`<button class="btn sm${fuseTarget===h.id?' warn':''}" data-act="fuse" data-id="${h.id}" ${busy||(!canFuse(h)&&fuseTarget!==h.id)?'disabled':''} title="${canFuse(h)?'Fusionner avec un doublon':'Il faut un autre '+CLASSES[h.cls].n+' '+h.stars+'★'}">${fuseTarget===h.id?'Annuler':'Fusionner'}</button>`:'';

      ${fuseBtn}
      ${!h.leg&&(h.awk||0)<AWK_MAX&&dupsOf(h).length?`<button class="btn sm${dupAsk===h.id?' warn':' prime'}" data-act="dupfuse" data-id="${h.id}" ${busy?'disabled':''}>${dupAsk===h.id?`Confirmer : absorber ${dupsOf(h)[0].name} ${dupsOf(h)[0].stars}★ niv. ${dupsOf(h)[0].lvl}`:`Doublon ✦ (${dupsOf(h).length})`}</button>`:''}
      <button class="btn sm ${conf?'warn':''}" data-act="dismiss" data-id="${h.id}" ${busy?'disabled':''}>${conf?'Confirmer ?':'Renvoyer'}</button>
    </div>`;
  }
  const flag=mode==='full'&&inTrain(h.id)?'<span class="flag">Entraînement</span>':mode==='full'&&inP?'<span class="flag">Équipe</span>':note?`<span class="flag">${note}</span>`:'';
  return`<article class="hero r${h.stars}${fuseTarget===h.id&&mode==='full'?' fuse-on':''}"${style}>
    ${flag}<div class="pic">${portrait(h)}</div>
    <div><div class="hname">${h.name}${awkTag(h)}</div>${L?`<div class="title">${L.title}</div>`:''}${starsHtml(h.stars)}${dupStars(h)}</div>
    <div class="meta">${elChip(h.el)} ${CLASSES[h.cls].n} · Niv. ${h.lvl}${h.lvl>=cap?' (max)':''}</div>${traitOf(h)?`<div class="trait" style="--tc:${traitOf(h).c}"><b>${traitOf(h).n}</b> · ${traitOf(h).d}</div>`:''}
    ${L?skillBox(L):''}
    ${mode==='pull'?'':hpBar(h.hp,s.hp)}
    ${mode==='full'?`<dl class="st"><div><dt>ATQ</dt><dd>${s.atk}</dd></div><div><dt>DÉF</dt><dd>${s.def}</dd></div><div><dt>VIT</dt><dd>${s.spd}</dd></div><div><dt>CRIT</dt><dd>${s.crit}%</dd></div><div><dt>D.CRIT</dt><dd>${s.cdmg}%</dd></div><div><dt>PÉN</dt><dd>${s.pen}%</dd></div></dl>
    <div class="xp">${h.lvl>=cap?'Niveau maximal':`XP ${h.xp}/${xpNeed(h.lvl)} · max niv. ${cap}`}</div>`:''}
    ${acts}
  </article>`;
}

/* ---------- Tour principale : mode Difficile (débloqué après l'étage 250) ---------- */
let tmode='normal';
const hardOn=()=>(S.best||0)>=TOWER_MAX;
const hardEq=f=>Math.round(245+1.2*f);
function genHardFoes(f){
  const e=hardEq(f),sc=scHard(scMain(e))*(f===TOWER_MAX?1.25:1),fe=[randEl(),randEl()];
  if(f%10===0){const b=f===TOWER_MAX?'Souverain de la Tour':BOSSES[(f/10-1)%BOSSES.length];return[{n:b,hp:Math.round(380*sc),atk:Math.round(17*sc),def:Math.round(7*sc),spd:8,boss:true,el:fe[0],lv:e}]}
  return Array.from({length:5},()=>{const t=pick(FOES);return{n:t.n,hp:Math.round(t.hp*sc),atk:Math.round(t.atk*sc),def:Math.round(t.def*sc),spd:t.spd,el:pick(fe),lv:e}});
}
/* Récompenses Difficile : toujours au-dessus de l'étage 250 en Normal (520 cristaux, 3 150 or) */
const hardRw=f=>{const b=f%10===0;return{gems:600+f*5+(b?500:0),gold:4000+f*80+(b?8000:0),shards:6+Math.floor(f/20)+(b?40+Math.floor(f/4):0),tomes:b?(f%50===0?3:2):0}};
function hardState(){if(!S.hard)S.hard={floor:1,best:0,foes:null};if(!S.hard.foes&&S.hard.floor<=TOWER_MAX)S.hard.foes=genHardFoes(S.hard.floor);return S.hard}
function climbHard(){
  if(busy||!hardOn())return;const H=hardState();
  if(H.floor>TOWER_MAX)return toast('Vous avez terminé la Tour en Difficile !');
  const party=partyHeroes().filter(h=>h.hp>0);if(!party.length)return toast('Aucun héros en état de combattre dans l’équipe.');
  const f=H.floor;seeFoes(H.foes,`Tour Difficile, étage ${f}`);
  const sum={floor:f,win:false,fallen:[],levels:[],gems:0,gold:0,loot:[],label:`Difficile, étage ${f}`};
  startBattle(party,H.foes,S.slots,sum,res=>{sum.win=res.win;
    casualties(res,sum,`Difficile, étage ${f}`);
    sum.head=res.win?`Étage ${f} Difficile conquis !`:`Repoussés à l’étage ${f} Difficile.`;
    if(res.win){rareDrop(sum);if(Math.random()<.5)rareDrop(sum);
      const r=hardRw(f);
      sum.gems=r.gems;sum.gold=Math.round(r.gold*goldMul());sum.shards=Math.round(r.shards*shardMul());
      S.gems+=sum.gems;S.gold+=sum.gold;S.shards+=sum.shards;if(r.tomes)sum.tomes=giveTomes(r.tomes);
      grantXp(party,800+f*20,sum);track('climb');
      H.floor++;H.best=Math.max(H.best,f);
      if(f>=TOWER_MAX){S.gems+=5000;S.gold+=100000;S.shards+=500;S.tears=(S.tears||0)+1;giveTomes(5);sum.done='Tour Difficile terminée ! Récompense finale : +5 000 cristaux, +100 000 or, +500 éclats, +5 Tomes de maîtrise et 1 Larme de l’Oracle.'}
      H.foes=H.floor>TOWER_MAX?[]:genHardFoes(H.floor);
    }},'tower');
}
function towerModeChips(){return hardOn()?`<div class="tmode" role="tablist"><button role="tab" data-act="tmode" data-id="normal" aria-selected="${tmode==='normal'}">Normal</button><button role="tab" class="hard" data-act="tmode" data-id="hard" aria-selected="${tmode==='hard'}">Difficile · ${Math.min(TOWER_MAX,hardState().best)}/${TOWER_MAX}</button></div>`:''}

}


function itemCard(it,mode){
  const sl=SLOT[it.slot],w=it.by!=null&&heroById(it.by);
  const enh=`<button class="btn sm" data-act="enh" data-id="${it.id}" ${it.plus>=MAXPLUS||S.gold<enhCost(it)?'disabled':''}>${it.plus>=MAXPLUS?'+15 max':`Améliorer · ${enhCost(it)} or`}</button>`;

  if(mode==='pick')acts=`<button class="btn sm prime" data-act="equip" data-id="${it.id}">${w?'Prendre':'Équiper'}</button>`+enh;

}

function ascBlock(h){
  if(h.stars>=STAR_MAX)return`<h2 style="margin-top:14px">Ascension</h2><p class="note" style="margin-top:0">${h.name} a atteint 6★, le maximum : niveau 60 débloqué.</p>`;
  const c=ASC[h.stars],g=ascGold(h),ok=S.shards>=c&&S.gold>=g;
  return`<h2 style="margin-top:14px">Ascension</h2><div class="ascbox">
    <div><div class="hname" style="font-size:17px">${h.stars}★ → ${h.stars+1}★</div><div class="meta">PV, ATQ et DÉF ×${(MULT[h.stars+1]/MULT[h.stars]).toFixed(2).replace('.',',')} · VIT +1 · niveau max ${capOf(h)} → ${capOf({stars:h.stars+1})}</div></div>
    <div class="ascost"><span class="${S.shards>=c?'good':'bad'}">${STARIC} ${S.shards}/${c} éclats</span><span class="${S.gold>=g?'good':'bad'}">${COIN} ${g.toLocaleString('fr-FR')} or</span></div>
    <div><button class="btn prime" data-act="asc" data-id="${h.id}" ${!ok||busy?'disabled':''}>Faire l’ascension</button></div></div>

}
function renderPicker(h){
  const sl=SLOT[pickSlot],cur=S.inv.find(i=>i.by===h.id&&i.slot===pickSlot);

  const cards=order.map(d=>{
    const L=S.dunSel[d.k],max=S.dun[d.k],foes=dunFoes(d.k),names=labelFoes(foes),fp=foesPower(foes),w=lootWeights(L);

      <div><div class="rowlab" style="margin-top:0"><b>Niveau ${L}</b><span>${max<DUN_MAX?`Battez le niveau ${max} pour débloquer le ${max+1}`:'Tous les niveaux débloqués'}</span></div>

      <div class="foes" style="margin-top:0">${foes.map((x,i)=>`<div class="foe${x.boss?' boss':''}">${elChip(x.el)} <b>${names[i]}</b> <span class="muted">PV ${x.hp} · ATQ ${x.atk}</span></div>`).join('')}</div>

function renderTrain(){
  const top=topLevel(),rate=trainRate(),slots=[];
  for(let i=0;i<TRAIN_MAX;i++){
    const e=S.train[i];
    if(i>=S.trainSlots){slots.push(i===S.trainSlots?`<div class="tslot locked"><span class="meta">Emplacement verrouillé</span><button class="btn sm" data-act="tunlock" ${S.gold<TRAIN_UNLOCK[i]?'disabled':''}>Débloquer · ${TRAIN_UNLOCK[i].toLocaleString('fr-FR')} or</button></div>`:`<div class="tslot locked"><span class="meta">Verrouillé</span></div>`);continue}
    if(!e){slots.push(`<div class="tslot empty"><span class="plus">+</span><span class="meta">Libre : choisissez un héros plus bas</span></div>`);continue}
    const h=heroById(e.id);if(!h)continue;
    const lim=trainLimit(h),capped=h.lvl>=lim,s=stats(h),others=topLevel(h.id);
    const why=capOf(h)<=Math.max(h.lvl,others)?'max de ses étoiles':`héros le plus haut : niv. ${others}`;
    const gained=h.lvl-e.from;
    slots.push(`<div class="tslot r${h.stars}"><div class="htop"><div class="ava">${portrait(h)}</div><div style="min-width:0"><div class="hname">${h.name}</div>${starsHtml(h.stars)}<div class="meta">${CLASSES[h.cls].n} · Niv. <b>${h.lvl}</b> / ${lim}</div></div></div>
      <div class="hp"><div class="lab"><span>${capped?'Plafond atteint':'XP'}</span><span>${capped?why:`${h.xp}/${xpNeed(h.lvl)}`}</span></div><div class="bar xpbar"><i style="width:${capped?100:Math.round(h.xp/xpNeed(h.lvl)*100)}%"></i></div></div>
      ${hpBar(h.hp,s.hp)}
      <div class="meta">${gained>0?`+${gained} niveau${gained>1?'x':''} depuis son arrivée`:`Arrivé au niveau ${e.from}`}${capped?'':` · niveau suivant dans ~${Math.max(1,Math.ceil((xpNeed(h.lvl)-h.xp)/rate))} min`}</div>
      <div><button class="btn sm" data-act="trem" data-id="${h.id}">Retirer</button></div></div>`);
  }
  const avail=sortedHeroes().filter(h=>!inTrain(h.id)),full=S.train.length>=S.trainSlots;
  return`<section class="panel"><h2>Zone d’entraînement · ${S.train.length}/${S.trainSlots}</h2>
    <p class="hint">Les héros placés ici gagnent <b>${rate} XP par minute</b>, même jeu fermé, et récupèrent 3 % de leurs PV par minute. Ils quittent la formation et ne combattent pas. Le gain d’XP augmente avec votre record dans la Tour.</p>
    <div class="capbox"><div><span class="meta">Plafond</span><b>Niv. ${top||'–'}</b></div><p class="meta" style="margin:0">Un héros à l’entraînement ne dépasse jamais le niveau de votre héros le plus haut hors entraînement, ni le niveau maximum de ses étoiles. L’ascension avec les éclats d’étoile relève ce maximum de 8 niveaux par étoile.</p></div>
    <div class="tslots">${slots.join('')}</div></section>

const REVIVE_MS=5*3600e3;
const reviveLeft=x=>Math.max(0,(x.at||0)+REVIVE_MS-Date.now());
const canRevive=()=>S.fallen.some(x=>x.cls&&CLASSES[x.cls]&&reviveLeft(x)<=0);
/* Larme de l’Oracle : ressource très rare (0,1 % par victoire hors missions et PvP), 1 larme = 1 résurrection */
const TEAR_RATE=.001;
const TEARI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 6 10.4 6 14a6 6 0 0 0 12 0c0-3.6-3-7-6-11.5z" fill="#b98cff" stroke="#f1e4ff" stroke-width="1.2"/><path d="M9.5 14.5a2.6 2.6 0 0 0 2.4 2.6" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>';
function rareDrop(sum,n){let k=0;for(let i=0;i<(n||1);i++)if(Math.random()<TEAR_RATE)k++;if(!k)return 0;S.tears=(S.tears||0)+k;if(sum)sum.tear=(sum.tear||0)+k;setTimeout(()=>toast(`Incroyable ! Vous trouvez ${k>1?k+' Larmes':'une Larme'} de l’Oracle.`),600);return k}
function revive(i){
  const x=S.fallen[i];if(!x||busy||reviveLeft(x)>0||!CLASSES[x.cls])return;
  if((S.tears||0)<1)return toast('Il faut une Larme de l’Oracle pour ramener un héros.');
  S.tears--;S.fallen.splice(i,1);
  if(x.leg){const own=S.heroes.find(h=>h.leg===x.leg);if(own){if((own.awk||0)<AWK_MAX){withRatio(own,()=>{own.awk=(own.awk||0)+1})}else S.shards+=40;save();render();return toast(`${x.name} rejoint ${own.name} déjà présent : doublon absorbé.`)}}
  const base=x.hero||{name:x.name,cls:x.cls,stars:x.stars,lvl:x.lvl,xp:0,awk:x.awk||0,leg:x.leg||undefined,el:x.el||randEl(),seed:x.seed,trait:pick(TRAITS).k};
  const h={...base,id:S.next++,lvl:1,xp:0,skl:[1,1,1],awk:x.awk||base.awk||0};delete h.hpMul;if(!h.leg)delete h.leg;h.hp=stats(h).hp;
  S.heroes.push(h);sfx('heal');save();render();toast(`${h.name} revient à la vie au niveau 1, avec ses ${h.awk} doublon${h.awk>1?'s':''}. Son équipement est dans le sac.`);
}
function renderMemorial(){
  return`<section class="panel"><h2>Mémorial des tombés</h2><div class="tearbox"><span class="resic">${TEARI}</span><div><b>${S.tears||0} Larme${(S.tears||0)>1?'s':''} de l’Oracle</b><div class="meta">Ressource très rare : 0,1 % de chance à chaque victoire (Tour, donjons, tours élémentaires, événements, boss de guilde, farm automatique). Pas dans les missions ni en PvP.</div></div></div>
  <p class="note">Une Larme ramène un héros tombé, au plus tôt 5 heures après sa chute. Il revient au <b>niveau 1</b>, compétences au niveau 1, et ne garde que ses étoiles et ses doublons. Son équipement est resté dans le sac.</p>
  ${S.fallen.length?`<div class="fallen">${S.fallen.map(x=>`<div><div class="ava">${portrait(x)}</div><div class="info"><span><b>${x.name}</b> <span class="r${x.stars}"><span class="stars">${'★'.repeat(x.stars)}</span></span> · ${CLASSES[x.cls].n} niv. ${x.lvl}${x.awk?` · éveil ${x.awk}`:''}</span><span class="muted">${x.where||'Étage '+x.floor}, vaincu par ${x.killer||'l’inconnu'}</span>${CLASSES[x.cls]?(reviveLeft(x)<=0?`<button class="btn sm prime" data-act="revive" data-id="${S.fallen.indexOf(x)}" ${busy||(S.tears||0)<1?'disabled':''}>Faire revivre · 1 Larme</button>`:`<span class="meta">Résurrection possible dans ${fmtLeft(reviveLeft(x))} (1 Larme)</span>`):''}</div></div>`).join('')}</div>`:'<p class="empty">Aucun héros n’est encore tombé. Que cela dure.</p>'}
  </section>
  <section class="row"><button class="btn ${pendingReset?'warn':''}" data-act="reset">${pendingReset?'Confirmer : tout effacer ?':'Recommencer une partie'}</button><span class="muted" style="font-size:13px">${S.pulls} appels effectués au total.</span></section>`;
}

function render(){
  if(S.guild)guildTick();
  fkey=tab==='etower'?etab:'main';
  tickEnergy();tickTrain();
  renderHud();renderDock();
  const m=document.getElementById('main');
  m.className=tab==='home'?'home':'pad gut';
  m.innerHTML=tab==='home'?renderHome():tab==='tower'?renderTower():tab==='dungeon'?renderDungeon():tab==='bag'?renderBag():tab==='quests'?renderQuests():tab==='pvp'?renderPvp():tab==='guild'?renderGuild():tab==='events'?renderEvents():tab==='etower'?renderETower():tab==='train'?renderTrain():tab==='summon'?renderSummon():tab==='heroes'?renderHeroes():tab==='rank'?renderRank():renderMemorial();
  const l=document.getElementById('blog');if(l)l.scrollTop=l.scrollHeight;
}

let toastT=null;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const id=b.dataset.id,n=Number(id);
  switch(b.dataset.act){
    case 'tab':tab=id;sheetId=null;selHero=null;pickSlot=null;render();window.scrollTo({top:0});if((tab==='tower'||tab==='dungeon'||tab==='events'||tab==='guild'||tab==='pvp')&&busy)play();break;
    case 'etopen':if(S.best<ET_UNLOCK){toast(`Atteignez l’étage ${ET_UNLOCK} de la Tour principale.`);break}etab=id;tab='etower';selHero=null;sheetId=null;render();window.scrollTo({top:0});if(busy)play();break;
    case 'eclimb':climbE();break;
    case 'sheet':sheetId=n;pickSlot=null;tab='heroes';render();window.scrollTo({top:0});break;
    case 'closesheet':sheetId=null;pickSlot=null;render();break;
    case 'gslot':pickSlot=pickSlot===id?null:id;render();if(pickSlot){const el=document.getElementById('picker');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case 'equip':equip(n);break;
    case 'unequip':unequip(n);break;
    case 'enh':enhance(n);break;
    case 'sell':sellItem(n);break;
    case 'bagf':bagFilter=id;render();break;
    case 'bags':bagSet=id;render();break;
    case 'bagc':bagCat=id;render();break;
    case 'recr':{recOpen=true;const r=+id;recSel.has(r)?recSel.delete(r):recSel.add(r);recAsk=false;render();break}
    case 'reck':recOpen=true;recKeep=!recKeep;recAsk=false;render();break;
    case 'recgo':recOpen=true;recycle();break;
    case 'dlvl':{if(busy)break;const [k,l]=id.split(':');S.dunSel[k]=Number(l);save();render();break}
    case 'drun':runDungeon(id);break;
    case 'asc':ascend(n);break;
    case 'afk':claimAfk();break;
    case 'chatdel':chatDel(id);break;
    case 'qsub':qsub=id;render();break;
    case 'mclaim':claimMission(id);break;
    case 'mchest':claimChest();break;
    case 'gclaim':claimGuide();break;
    case 'aclaim':claimAch(id);break;
    case 'story':showStory(n);render();break;
    case 'intro':showIntro(0);break;
    case 'intronext':showIntro(n);break;
    case 'introskip':S.introSeen=true;save();closeModal();if(!(S.storyRead&&S.storyRead[0]))showStory(0);render();break;
    case 'settings':openSettings();break;
    case 'mclose':closeModal();break;
    case 'keepcloud':if(conflictRemote)adoptSave(conflictRemote,'Sauvegarde en ligne chargée.');break;
    case 'keeplocal':CLOUD.status='on';closeModal();save();cloudPush();toast('Sauvegarde de cet appareil conservée.');break;
    case 'setname':{const v=(document.getElementById('pseudo').value||'').replace(/\s+/g,' ').trim().slice(0,20);S.settings=S.settings||{};S.settings.name=v;save();goSync();toast(v?`Pseudo enregistré : ${v}`:'Pseudo effacé.');break}
    case 'togsfx':S.settings=S.settings||{};S.settings.sfx=S.settings.sfx===false;save();openSettings();break;
    case 'togmusic':S.settings=S.settings||{};S.settings.music=!S.settings.music;save();if(typeof musicSync==='function')musicSync();openSettings();break;
    case 'cloudnow':save();cloudPush().then(()=>toast('Sauvegarde envoyée.'));break;
    case 'copyexp':{const ta=document.getElementById('expcode');const v=ta.value;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>toast('Code copié.'),()=>{ta.select();toast('Sélectionnez le texte et copiez-le.')})}else{ta.select();toast('Sélectionnez le texte et copiez-le.')}break}
    case 'import':{const raw=(document.getElementById('impcode').value||'').trim();let obj=null;try{obj=parseSave(decodeURIComponent(escape(atob(raw))))}catch(e){}
      if(!obj){toast('Code invalide.');break}
      if(!pendingImport){pendingImport=true;b.textContent='Confirmer : remplacer ma partie';b.classList.add('warn');break}
      adoptSave(obj,'Partie importée.');break}
    case 'wipe':if(!pendingWipe){pendingWipe=true;b.textContent='Confirmer : tout effacer';b.classList.add('warn');break}closeModal();pendingReset=true;resetGame();break;
    case 'pvppick':pvpToggle(n);break;
    case 'pvprow':pvpRow(n);break;
    case 'pvpsubmit':pvpSubmit();break;
    case 'pvpclaim':pvpClaim();break;
    case 'pvpwatch':pvpWatch(id);break;
    case 'gcolor':gColor=id;render();break;
    case 'gcreate':createGuild();break;
    case 'gnsub':gnsub=id;render();break;
    case 'gjoin':joinGuild(id);break;
    case 'gleave':gLeaveAsk=true;render();break;
    case 'gleaveno':gLeaveAsk=false;render();break;
    case 'gleaveok':leaveGuild();break;
    case 'gsub':gsub=id;render();break;
    case 'gdon':gDonate(id);break;
    case 'gboss':gBossAttack();break;
    case 'gwar':gWarAttack(n);break;
    case 'gbuy':gBuy(id);break;
    case 'evstart':evStartTour(id);break;
    case 'evplay':{const el=document.getElementById('rsel');if(el)royaleSel=Number(el.value);evPlay(id);break}
    case 'evclaim':{const [iid,k]=id.split('|');evClaim(iid,Number(k));break}
    case 'tadd':addTrain(n);break;
    case 'trem':leaveTrain(n);break;
    case 'tunlock':unlockTrain();break;
    case 'climb':climb();break;
    case 'climbh':climbHard();break;
    case 'refill':refillEnergy();break;
    case 'goref':tab='dungeon';render();requestAnimationFrame(()=>{const el=document.getElementById('refill');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})});break;
    case 'tmode':tmode=id;window.scrollTo(0,0);render();break;
    case 'rest':rest();break;
    case 'daily':claimDaily();break;
    case 'fav':cycleFav();break;
    case 'slot':clickSlot(n);break;
    case 'setlead':setLead(n);break;
    case 'unslot':unslot(n);break;
    case 'pick':pickHero(n);break;
    case 'speed':speed=speed===1?3:1;b.textContent=`Vitesse ×${speed===1?3:1}`;break;
    case 'skip':finish();break;
    case 'bsk':{const w=bWait();if(w){w.sel=+id;bctlRefresh()}break}
    case 'btgt':bTarget(+id);break;
    case 'bgo':{const w=bWait();if(w)bAct({i:w.sel});break}
    case 'bauto':bAuto();break;
    case 'goform':fkey='main';tab='tower';sheetId=null;render();requestAnimationFrame(()=>{const el=document.getElementById('formation');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});break;
    case 'psub':psub=id;render();break;
    case 'rtago':rtaStart();break;
    case 'rtacancel':rtaCancel();break;
    case 'rtapick':rtaPick(+id);break;
    case 'rtaban':rtaBan(+id);break;
    case 'rtaquit':rtaQuit();break;
    case 'rtaback':RT.st='idle';if(lastBattle&&lastBattle.mode==='rta')lastBattle=null;render();break;
    case 'royreg':royRegister(+id);break;
    case 'royclaim':royClaim();break;
    case 'roylog':royShowLog=!royShowLog;render();break;
    case 'rsub':rsub=id;render();break;
    case 'revive':revive(+id);break;
    case 'dupfuse':dupFuse(+id);break;
    case 'skup':{const [a,b]=String(id).split(':');skillUp(+a,+b);break}
    case 'bmode':S.settings=S.settings||{};S.settings.manual=!S.settings.manual;save();render();toast(S.settings.manual?'Mode manuel : vous choisissez les compétences et les cibles.':'Mode auto : vos héros combattent seuls.');break;
    case 'pull1':summon(1);break;
    case 'pull10':summon(10);break;
    case 'party':toggleParty(n);break;
    case 'train':train(n);break;
    case 'fuse':startFuse(n);break;
    case 'sacrifice':fuse(n);break;
    case 'dismiss':dismiss(n);break;
    case 'reset':resetGame();break;
  }
});

S=load();
if(!S||!Array.isArray(S.heroes))newGame();else{migrate();enforceDead();save()}
render();
if(!S.introSeen)showIntro(0);
cloudInit();
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!modalLocked)closeModal()});
document.getElementById('chatfab').addEventListener('click',()=>chatToggle());
document.getElementById('chatclose').addEventListener('click',()=>chatToggle(false));
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();chatSend()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!document.getElementById('modal').hidden&&!modalLocked){closeModal();return}if(CH.open)chatToggle(false)});
if(!window.claude){document.getElementById('chatfab').hidden=true;GO.status='offline'}else{initChat();initGuildOnline();initPvp()}
document.addEventListener('input',e=>{if(e.target.id==='gname')gNameDraft=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='rsel')royaleSel=Number(e.target.value)});
setInterval(()=>{if(!busy&&((tab==='train'&&S.train.length)||tab==='tower'||tab==='events'||tab==='guild')){render();save()}},30000);
setInterval(()=>{const e=S.energy;tickEnergy();if(S.energy!==e){save();const el=document.getElementById('energy');if(el)el.textContent=`${S.energy}/${ENERGY_MAX}`}},20000);
</script>

</body>
</html>
