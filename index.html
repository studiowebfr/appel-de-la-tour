<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Appel de la Tour : un jeu gacha où l’on invoque des héros pour gravir une tour de 250 étages.">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* Firebase : remplace les services de claude.ai (base partagée, identité) quand le jeu tourne hors de claude.ai */
window.FIREBASE_CONFIG = {"apiKey": "AIzaSyDY0B7n1CO-riUf_W5z5xoA59HlcIDNKoE", "authDomain": "appel-de-la-tour.firebaseapp.com", "projectId": "appel-de-la-tour", "storageBucket": "appel-de-la-tour.firebasestorage.app", "messagingSenderId": "433520800662", "appId": "1:433520800662:web:bd8d57aa19ff5b167c63b7"};
(function(){
  if(window.claude||!window.FIREBASE_CONFIG)return;
  let ready=null;
  function boot(){
    if(ready)return ready;
    ready=new Promise(res=>{
      try{
        firebase.initializeApp(window.FIREBASE_CONFIG);
        const auth=firebase.auth(),fs=firebase.firestore();
        auth.onAuthStateChanged(u=>{if(u)res({fs,uid:u.uid})});
        auth.signInAnonymously().catch(()=>res(null));
        setTimeout(()=>res(null),10000);
      }catch(e){res(null)}
    });
    return ready;
  }
  window.claude={use:async function(name){
    const b=await boot();if(!b)return null;
    if(name==='db')return b.fs;
    if(name==='user')return{id:async()=>b.uid,can:async()=>true,isOwner:async()=>false,canEdit:async()=>false,profiles:async ids=>Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:'',guest:false}])),me:async()=>({id:b.uid,name:''})};
    return null;
  }};
})();
</script>
</head>
<body>
<title>Appel de la Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : écran de jeu mobile (colonne max 520px) — HUD collant en haut, scène d'accueil illustrée, barre d'icônes collante en bas */
:root{
  color-scheme:dark;
  --bg:#070a12; --wood:#1a284a; --wood2:#111b33; --panel:#0e1526; --panel2:#16213a; --line:#263d71;
  --fg:#dae6f7; --muted:#607dc1; --brass:#68d0f3; --brass-dim:#243f7c; --ink:#0d172d;
  --danger:#ff6b5b; --heal:#86dc93;
  --r1:#cfd3d9; --r2:#7fd48a; --r3:#6cbaf5; --r4:#c895ff; --r5:#ffd35a;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Noto Sans","Segoe UI",system-ui,sans-serif;
}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.45;background:radial-gradient(120% 80% at 50% 0%,#0c1222,var(--bg))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wood2)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a101d,#070c15);box-shadow:0 0 0 2px #0e182f,0 0 60px rgba(0,0,0,.6)}
.gut{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#1a294b,#111b33);border-bottom:3px solid var(--brass-dim);box-shadow:0 4px 12px rgba(0,0,0,.4);padding-block:8px;display:flex;align-items:center;gap:10px}
.me{position:relative;width:58px;height:58px;flex:none;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#a9c7f0,#2e9cc0,#a9c7f0,#2e9cc0,#a9c7f0)}
.me .ava{width:100%;height:100%;border-radius:50%}
.lvl{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:12px;line-height:1;background:var(--ink);border:1.5px solid var(--brass);border-radius:8px;padding:3px 6px 2px;white-space:nowrap}
.plate{flex:1;min-width:0;display:grid;gap:2px}
.plate .who{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate .pw{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.plate .pw b{color:var(--fg);font-family:var(--display)}
.wallet{display:grid;gap:4px;flex:none}
.pill{display:flex;align-items:center;gap:6px;background:rgba(4,8,15,.65);border:1.5px solid var(--brass-dim);border-radius:999px;padding:2px 4px 2px 2px;font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:118px}.pill svg, .pill img.art{width:20px;height:20px;flex:none}
.pill span{flex:1;text-align:right}
.pill .plus{width:20px;height:20px;border-radius:50%;border:0;background:linear-gradient(#60d4fb,#46b2d7);color:var(--ink);font-weight:800;line-height:20px;padding:0;font-size:15px}

/* Barre d'icônes */
.dock{position:sticky;bottom:0;z-index:20;margin-top:auto;background:linear-gradient(180deg,#1a294b,#0d1529);border-top:3px solid var(--brass-dim);box-shadow:0 -4px 14px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.dock button{background:none;border:0;display:grid;justify-items:center;gap:1px;padding:2px 0;position:relative;color:var(--muted)}
.dock .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#1f315a,#14203c);border:2px solid #223664;transition:transform .15s}.dock .ic svg, .dock .ic img.art{width:26px;height:26px}
.dock .lab{font-family:var(--display);font-weight:700;font-size:11px;line-height:1.2;text-shadow:0 1px 0 #000}
.dock button[aria-selected="true"]{color:var(--fg)}
.dock button[aria-selected="true"] .ic{transform:translateY(-6px);border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 3px rgba(104,208,243,.25),0 0 18px rgba(104,208,243,.55)}
.badge{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:#e8352b;border:2px solid #fff;font:800 10px/12px var(--display);color:#fff;text-align:center}

/* Accueil */
.scene{position:relative;min-height:640px;overflow:hidden;display:flex;flex-direction:column;padding-block:14px 14px;
  background:
    radial-gradient(45% 30% at 84% 34%,rgba(96,212,251,.55),transparent 70%),
    radial-gradient(70% 30% at 50% 88%,rgba(150,60,40,.45),transparent 70%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 64px),
    linear-gradient(180deg,#14203c 0 7%,#0b1325 7% 8.2%,#2e4373 8.2% 63%,#0e182f 63% 64.5%,#203057 64.5%)}
.window{position:absolute;right:6%;top:15%;width:28%;aspect-ratio:3/4;max-width:100%;border:6px solid #14203c;border-radius:50% 50% 4px 4px/30% 30% 4px 4px;background:linear-gradient(180deg,#c3d7f4,#60d4fb 60%,#66d1f5);box-shadow:0 0 40px rgba(96,212,251,.6)}
.window::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 47%,#14203c 47% 53%,transparent 53%),linear-gradient(180deg,transparent 47%,#14203c 47% 53%,transparent 53%)}
.shelf{position:absolute;left:4%;top:30%;width:26%;height:5px;background:#0e182f;box-shadow:0 26px 0 #0e182f}
.shelf::before{content:"";position:absolute;left:8%;bottom:5px;width:14px;height:22px;border-radius:3px;background:#7a3d6a;box-shadow:18px 4px 0 -2px #2f6a7a,34px 0 0 #3f99b7,60px 26px 0 2px #4d7a3a}
.rug{position:absolute;left:10%;right:10%;bottom:13%;height:11%;border-radius:50%;background:radial-gradient(closest-side,#a8483a,#7a2e26 70%,transparent 72%);opacity:.85}
.bunting{position:absolute;left:0;right:0;top:7.5%;height:34px;pointer-events:none}.bunting svg, .bunting img.art{width:100%;height:100%}
.stage{position:relative;z-index:2;width:min(84%,440px);margin:44px auto 0;aspect-ratio:5/4;max-width:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:breathe 4.5s ease-in-out infinite}.stage svg, .stage img.art{width:100%;height:100%;display:block}
@keyframes breathe{50%{transform:translateY(-6px)}}
.starplate{position:relative;z-index:3;margin:-14px auto 0;text-align:center;display:grid;justify-items:center;gap:2px}
.starplate .nm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-shadow:0 2px 0 #0d172d,0 0 12px rgba(0,0,0,.5)}
.starplate .title{text-shadow:0 1px 0 #000}
.chip{background:rgba(7,12,23,.7);border:1.5px solid var(--brass-dim);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.side{position:absolute;top:12px;z-index:4;display:grid;gap:8px}
.side.l{left:max(10px,env(safe-area-inset-left,0px))} .side.r{right:max(10px,env(safe-area-inset-right,0px))}
.rb{background:none;border:0;padding:0;display:grid;justify-items:center;gap:2px;position:relative;width:62px}
.rb .o{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#273965,#111b33);border:2.5px solid var(--brass);box-shadow:0 3px 0 #080e1c,0 0 0 2px rgba(0,0,0,.3);color:#aecaf1}.rb .o svg, .rb .o img.art{width:26px;height:26px}
.rb span{font-family:var(--display);font-weight:700;font-size:11.5px;line-height:1.1;text-align:center;text-shadow:0 1px 0 #000,0 0 4px #000}
.rb .badge{top:-2px;right:4px}
.rb:disabled{cursor:default}
.rb:disabled .o{filter:grayscale(.6) brightness(.8)}
.homefoot{position:relative;z-index:4;margin-top:auto;display:grid;gap:10px;padding-top:10px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qb{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;background:linear-gradient(180deg,#b9d0f0,#79c7e1);color:var(--ink);border:2.5px solid #20376d;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 #142346;text-align:left;min-width:0}.qb svg, .qb img.art{width:30px;height:30px;flex:none;color:#1a2d59}
.qb b{display:block;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.05}
.qb small{display:block;font-size:12px;font-weight:700;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb > div{min-width:0}
.banner{display:flex;align-items:center;gap:10px;width:100%;border:3px solid var(--brass);border-radius:14px;padding:8px 10px;text-align:left;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#2b3f9e,#6a3cc0 55%,#c0508e);box-shadow:0 3px 0 #2a1650,0 0 24px rgba(160,110,255,.35)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);transform:translateX(-100%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.banner .faces{display:flex;flex:none}
.banner .faces .ava{width:44px;height:44px;border-radius:50%;border:2px solid #60d4fb;margin-left:-12px}
.banner .faces .ava:first-child{margin-left:0}
.banner b{display:block;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.banner small{font-size:12px;font-weight:700;opacity:.9}
.banner > div{min-width:0;position:relative;z-index:1}

/* Contenu des autres écrans */
main.home{flex:1;display:flex;flex-direction:column}
main.home .scene{flex:1}
main.pad{padding-top:18px;padding-bottom:22px;display:grid;gap:18px;align-content:start}
h2{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--brass);margin:0 0 8px;text-shadow:0 1px 0 #000}
.panel{background:linear-gradient(180deg,#121c32,#0c1222);border:2px solid var(--line);box-shadow:inset 0 0 0 1px rgba(104,208,243,.18),0 4px 10px rgba(0,0,0,.35);border-radius:14px;padding:16px}
.btn{background:linear-gradient(180deg,#1f315a,#14203c);border:2px solid #263d71;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 0 #080e1c}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn.prime{background:linear-gradient(180deg,#60d4fb,#4ebde3);border-color:#cbddf6;color:var(--ink);font-family:var(--display);font-size:16px;box-shadow:0 3px 0 #1c305f}
.btn.prime:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* Tour */
.floorhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.floorno{font-family:var(--display);font-weight:800;line-height:.85;font-size:clamp(60px,18vw,96px);font-variant-numeric:tabular-nums;color:#b5cef2;text-shadow:0 3px 0 #1c305f}
.floorno small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;text-shadow:none;line-height:1.2}
.bosstag{display:inline-block;margin-top:8px;font-family:var(--display);font-size:13px;color:#fff;background:#b3261e;border:1.5px solid #ffb4a8;padding:1px 10px;border-radius:999px;text-shadow:none;line-height:1.4}
.foes{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.foe{background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px}
.foe b{font-weight:800}
.foe.boss{border-color:var(--danger)}
.foe .muted{font-variant-numeric:tabular-nums}
.partyline{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{border:2px dashed var(--line);border-radius:12px;min-height:84px;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}

/* Cartes de héros */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hero{background:linear-gradient(180deg,#121c32,#0c1222);border:2px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start;position:relative;min-width:0}
.hero.r5{border-color:var(--r5);box-shadow:0 0 18px -4px rgba(96,212,251,.6)}
.hero.r4{border-color:var(--r4)}
.hero.r3{border-color:#4d86b8}
.hero.fuse-on{outline:3px solid var(--brass)}
.flag{position:absolute;top:12px;right:12px;font-family:var(--display);font-weight:800;font-size:11px;color:var(--ink);background:var(--brass);padding:0 7px;border-radius:999px;z-index:1}
.pic{width:100%;aspect-ratio:5/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--panel2)}.pic svg, .ava svg, .pic img.art, .ava img.art{width:100%;height:100%;display:block}
.ava{width:46px;height:46px;flex:none;border-radius:8px;overflow:hidden;background:var(--panel2)}
.htop{display:flex;gap:8px;align-items:center;min-width:0}
.hname{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.1;overflow-wrap:anywhere}
.title{font-size:12px;color:var(--r5);font-style:italic;font-weight:700}
.tag{display:inline-block;font-family:var(--display);font-weight:800;font-size:10.5px;padding:0 6px;border-radius:999px;border:1.5px solid var(--brass-dim);color:var(--brass);vertical-align:middle;font-style:normal;line-height:1.5}
.tag.gold{border-color:var(--r5);color:var(--r5)}
.stars{font-size:13px;letter-spacing:1px;line-height:1;text-shadow:0 1px 0 #000}
.stars span{color:rgba(255,255,255,.15)}
.r1 .stars{color:var(--r1)} .r2 .stars{color:var(--r2)} .r3 .stars{color:var(--r3)} .r4 .stars{color:var(--r4)} .r5 .stars{color:var(--r5)}
.meta{font-size:12px;color:var(--muted)}
.skill{font-size:12px;line-height:1.35;background:rgba(96,212,251,.08);border:1.5px solid rgba(96,212,251,.35);border-radius:8px;padding:5px 7px}
.skill b{display:block;color:var(--r5);font-family:var(--display);font-weight:800}
.hp{display:grid;gap:3px}
.hp .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#a6f0b0,#4caf62);transition:width .3s ease}
.bar i.mid{background:linear-gradient(180deg,#60d4fb,#41afd4)} .bar i.low{background:linear-gradient(180deg,#ff9a8a,#d0372a)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0}
.st div{background:rgba(0,0,0,.25);border-radius:6px;padding:3px 6px}
.st dt{font-size:10px;font-weight:800;color:var(--muted)}
.st dd{margin:0;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.xp{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hact{display:flex;gap:5px;flex-wrap:wrap}

/* Fusion */
.fusebox{border-color:var(--brass)}
.fusehead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fusehead .ava{width:64px;height:64px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mat{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.mat > div{min-width:0;flex:1;display:grid;gap:4px}

/* Combat */
.battle{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side-col h3{font-family:var(--display);font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px}
.unit{display:grid;gap:3px;margin-bottom:8px;transition:opacity .3s}
.unit .lab{display:flex;justify-content:space-between;font-size:13px;gap:8px;font-weight:700}
.unit .lab span:last-child{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.unit.dead{opacity:.35}
.unit.dead .lab span:first-child{text-decoration:line-through}
.log{grid-column:1/-1;max-height:240px;overflow-y:auto;background:#c2d4ee;color:#0d172d;border:2px solid #20376d;border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:2px;align-content:start}
.log p{margin:0}
.log .hit-h{color:#0d172d} .log .hit-f{color:#8a3a2a} .log .heal{color:#21753a;font-weight:700} .log .skill{color:#1c3162;font-weight:800;background:none;border:0;padding:0}
.log .death{color:#b3261e;font-weight:800} .log .kill{color:#17274e;font-weight:700}
.log .sys{color:#314167} .log .win{color:#1c3162;font-weight:800;font-family:var(--display);font-size:16px} .log .lose{color:#b3261e;font-weight:800;font-family:var(--display);font-size:16px}
.bctl{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.atb{width:100%;height:3px;border-radius:2px;background:rgba(0,0,0,.35);overflow:hidden}
.atb i{display:block;height:100%;background:#7fd0ff;transition:width .3s}
.fxs{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:12px}
.fx{font-style:normal;font-size:8.5px;font-weight:800;line-height:1;padding:2px 3px;border-radius:4px;white-space:nowrap}
.fx.g{background:rgba(95,174,106,.9);color:#fff}.fx.b{background:rgba(192,80,74,.92);color:#fff}
.crown{position:absolute;top:-9px;left:-6px;font-size:15px;color:#ffd35a;text-shadow:0 1px 0 #000,0 0 4px #000;line-height:1;z-index:2}
.ava{position:relative}
.fmeta.lead{color:#ffd35a;font-weight:700}
.tok.turn .tface{box-shadow:0 0 0 3px #ffd35a,0 0 14px rgba(96,212,251,.8)}
.tok.tgt{cursor:pointer}.tok.tgt .tface{box-shadow:0 0 0 2px #ff7a6a;animation:tglow 1s ease-in-out infinite}
@keyframes tglow{50%{box-shadow:0 0 0 3px #ff7a6a,0 0 12px rgba(255,122,106,.8)}}
.mturn{display:grid;gap:8px;width:100%}
.mwho{display:flex;gap:10px;align-items:center}.mwho svg, .mwho img.art{width:38px;height:38px;border-radius:9px;flex:none}
.skrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.skb{display:grid;gap:2px;text-align:left;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:inherit;font:inherit;cursor:pointer;min-width:0}
.skb b{font-size:12.5px;line-height:1.15}.skb span{font-size:10.5px;color:var(--muted)}
.skb.on{border-color:#ffd35a;box-shadow:0 0 0 2px rgba(96,212,251,.35)}
.skb:disabled{opacity:.45;cursor:default}
.skd{margin:0;font-size:12.5px;color:var(--muted)}
.sklist{display:grid;gap:6px}.skill.lead b{color:#ffd35a}
.log p.turn{color:#2f6fae;font-weight:700}.log p.buff{color:#2f7d3a}.log p.debuff{color:#a3362e}

.summary{grid-column:1/-1;border-top:1.5px solid var(--line);padding-top:10px;display:grid;gap:6px;font-size:14px}
.summary .fall{color:var(--danger);font-weight:700}

/* Invocation */
.portal{display:grid;gap:16px;background:linear-gradient(135deg,#2b3f9e,#5a34a8 60%,#8a3c7e);border-color:var(--brass)}
.portal h3{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0 0 6px;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.portal .muted{color:#e2d6ff}
.rates{display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums;font-weight:700}
.rates div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:3px}
.pity{margin-top:10px;font-size:13px}
.pity .bar i{background:linear-gradient(180deg,#bcd3f3,#42c0ea)}
.pity .lab{color:#e2d6ff}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.results .hero{animation:rise .5s ease both}
.results .hero.r5{animation:rise .5s ease both,flare 1.4s ease .3s both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes flare{0%{box-shadow:0 0 0 0 rgba(96,212,251,.95)}100%{box-shadow:0 0 18px -4px rgba(96,212,251,.6)}}
.legends{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.legend.unowned .pic{filter:grayscale(.85) brightness(.6)}

/* Mémorial */
.fallen{display:grid;gap:2px}
.fallen > div{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.fallen .ava{filter:grayscale(1) brightness(.75)}
.fallen .info{flex:1;min-width:0;display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.fallen b{font-family:var(--display);font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#c2d4ee;color:var(--ink);border:2px solid #20376d;font-weight:800;padding:9px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.empty{color:var(--muted);font-size:14px;padding:16px 0}


/* Éléments, formation, synergies */
.el{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;line-height:1.45;padding:0 7px 0 5px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);border:1.5px solid var(--c);color:var(--c);vertical-align:middle;white-space:nowrap;font-style:normal;text-shadow:none}
.el::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:middle}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.hint b{color:var(--brass)}
.rowlab{display:flex;justify-content:space-between;gap:2px 8px;flex-wrap:wrap;align-items:baseline;margin:8px 0 6px;font-size:12px;color:var(--muted)}
.rowlab b{font-family:var(--display);font-size:15px;color:var(--fg)}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fslot{position:relative;min-width:0}
.fbtn{width:100%;height:100%;min-height:150px;background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:12px;padding:8px 5px;display:grid;justify-items:center;align-content:start;gap:3px;text-align:center}
.fslot.empty .fbtn{border-style:dashed;align-content:center;color:var(--muted);font-weight:700;font-size:12px}
.fslot.empty .plus{font-size:26px;line-height:1;font-family:var(--display)}
.fslot.target .fbtn{border-color:var(--brass);box-shadow:0 0 0 2px rgba(104,208,243,.2)}
.fslot.sel .fbtn,.bh.sel{border-color:var(--brass);background:rgba(104,208,243,.16);box-shadow:0 0 14px rgba(104,208,243,.45)}
.fbtn .ava{width:56px;height:56px;border-radius:10px}
.fname{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.1;overflow-wrap:anywhere}
.fmeta{font-size:11px;color:var(--muted);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}
.fbtn .bar{width:100%;height:5px;margin-top:2px}
.fwarn{font-size:10.5px;color:var(--danger);font-weight:800;line-height:1.2}
.x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:#b3261e;border:2px solid #fff;color:#fff;font-weight:800;line-height:18px;padding:0;font-size:15px;z-index:1}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.bh{background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:10px;padding:6px 4px;display:grid;justify-items:center;gap:3px;min-width:0}
.bh .ava{width:46px;height:46px}
.bn{font-family:var(--display);font-weight:800;font-size:13px;line-height:1.1;overflow-wrap:anywhere}
.syns{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.syn{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:rgba(0,0,0,.22);opacity:.72;display:grid;gap:3px;align-content:start}
.syn.on{opacity:1;border-color:var(--brass);background:rgba(104,208,243,.1)}
.sh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sh b{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.15}
.cnt{flex:none;font-family:var(--display);font-weight:800;min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);border:1.5px solid var(--line)}
.syn.on .cnt{background:var(--brass);color:var(--ink);border-color:#cbddf6}
.tier{display:inline-block;min-width:18px;text-align:center;border-radius:5px;border:1px solid var(--line);font-size:11px;font-weight:800;margin-left:3px}
.tier.on{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.sd{font-size:12.5px;line-height:1.35}
.syn.on .sd{color:var(--fg);font-weight:700}
.cycle{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.arr{color:var(--muted);font-weight:800}
.synmini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.synmini span{font-size:12px;font-weight:800;background:rgba(104,208,243,.14);border:1.5px solid var(--brass-dim);color:var(--brass);border-radius:999px;padding:0 8px}


/* Équipement, donjons, fiche héros */
.q1{--q:var(--r1)}.q2{--q:var(--r2)}.q3{--q:var(--r3)}.q4{--q:var(--r4)}.q5{--q:var(--r5)}.q6{--q:#ff6b9a}
.rank{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:6px;background:var(--q);color:#060a14;font-family:var(--display);font-weight:800;font-size:13px;line-height:1}
.item{background:linear-gradient(180deg,#121c32,#0c1222);border:2px solid var(--q);border-radius:12px;padding:9px;display:grid;gap:6px;align-content:start;min-width:0}
.item.q5{box-shadow:0 0 14px -4px var(--r5)} .item.q6{box-shadow:0 0 18px -3px #ff6b9a}
.ihead{display:flex;gap:8px;align-items:center;min-width:0}
.iic{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--q,var(--brass)) 20%,#070c15);border:1.5px solid var(--q,var(--line));color:var(--q,var(--muted))}.iic svg, .iic img.art{width:22px;height:22px}
.iname{font-family:var(--display);font-weight:800;font-size:14px;line-height:1.1;color:var(--q);overflow-wrap:anywhere}
.iname b{color:var(--fg)}
.imain{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:14px;background:rgba(0,0,0,.3);border-radius:7px;padding:4px 8px}
.imain b{font-family:var(--display);font-variant-numeric:tabular-nums}
.isubs{list-style:none;margin:0;padding:0;display:grid;gap:1px;font-size:12.5px}
.isubs li{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.isubs li b{color:var(--fg);font-variant-numeric:tabular-nums}
.up{color:var(--heal);font-size:10px}
.worn{font-size:11.5px;font-weight:800;color:var(--brass)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;color:var(--muted)}
.chipbtn[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:#cbddf6}
.sheethead{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr);gap:12px;align-items:start}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.stat{background:rgba(0,0,0,.28);border-radius:8px;padding:5px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.stat b{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat i{font-style:normal;font-size:11px;color:var(--heal);font-weight:800;margin-left:4px}
.gearslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gs{background:rgba(0,0,0,.28);border:2px solid var(--q,var(--line));border-radius:12px;padding:8px 5px;display:grid;justify-items:center;gap:3px;text-align:center;min-width:0;min-height:112px;align-content:start}
.gs.empty{border-style:dashed}
.gs.on{box-shadow:0 0 0 3px rgba(104,208,243,.4)}
.gs .gn{font-family:var(--display);font-weight:800;font-size:12.5px;line-height:1.1;overflow-wrap:anywhere;color:var(--q,var(--muted))}
.gs .gm{font-size:11.5px;font-weight:800}
.picker{border-color:var(--brass);scroll-margin-top:90px}
.ebar i{background:linear-gradient(180deg,#bfe8ff,#3b9ae0)}
.dun{display:grid;gap:10px}
.dunhead{display:flex;gap:12px;align-items:center}
.dunhead .iic{width:48px;height:48px}.dunhead .iic svg, .dunhead .iic img.art{width:28px;height:28px}
.tagslot{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:999px;padding:1px 9px 1px 6px}.tagslot svg, .tagslot img.art{width:15px;height:15px}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lv{width:36px;height:36px;border-radius:9px;background:rgba(0,0,0,.3);border:1.5px solid var(--line);font-family:var(--display);font-weight:800;padding:0}
.lv[aria-pressed="true"]{background:var(--brass);color:var(--ink);border-color:#cbddf6}
.lv:disabled{opacity:.35;cursor:not-allowed}
.lv[aria-pressed="true"]:disabled{opacity:1}
.drops{display:flex;gap:5px;flex-wrap:wrap;font-size:12px;font-weight:800;align-items:center}
.drops > span{display:inline-flex;align-items:center;gap:4px}
.pow{font-size:13px;font-weight:700}
.pow .bad{color:var(--danger)} .pow .good{color:var(--heal)}
.loot{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}

.ascbox{display:grid;gap:8px;background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:10px;padding:10px}
.ascost{display:flex;gap:12px;flex-wrap:wrap;font-weight:800;font-size:13px}
.ascost span{display:inline-flex;align-items:center;gap:4px}.ascost svg, .drops svg, .ascost img.art, .drops img.art{width:16px;height:16px}
.good{color:var(--heal)} .bad{color:var(--danger)}
.tslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tslot{background:rgba(0,0,0,.28);border:2px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:7px;align-content:start;min-width:0}
.tslot.empty,.tslot.locked{border-style:dashed;justify-items:center;text-align:center;min-height:120px;align-content:center}
.tslot.empty .plus{font-family:var(--display);font-size:28px;line-height:1;color:var(--muted)}
.tslot.r5{border-color:var(--r5)} .tslot.r4{border-color:var(--r4)}
.xpbar i{background:linear-gradient(180deg,#d9c2ff,#8a5ad8)}
.capbox{display:flex;gap:12px;align-items:center;background:rgba(104,208,243,.1);border:1.5px solid var(--brass-dim);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.capbox > div{display:grid;flex:none;text-align:center;gap:2px}
.capbox b{font-family:var(--display);font-size:22px;color:var(--brass);line-height:1}.btn svg, .btn img.art{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.afk{display:grid;gap:10px;border-color:var(--brass)}
.afkhead{display:flex;gap:12px;align-items:center}
.afkhead .iic{width:48px;height:48px}.afkhead .iic svg, .afkhead .iic img.art{width:28px;height:28px}
.afkbar i{background:linear-gradient(180deg,#bcd3f3,#42c0ea)}
.etgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.etc{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#0c1222),#0c1222);min-width:0}
.etn{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15;color:var(--c)}
.etc:disabled{filter:grayscale(.85);opacity:.55;cursor:not-allowed}
.etpanel{border-color:var(--c)}
.etpanel .floorno{color:var(--c);text-shadow:0 3px 0 rgba(0,0,0,.5)}
.evcard{display:grid;gap:10px}
.evtitle{display:flex;gap:12px;align-items:center}
.evtitle .iic{width:48px;height:48px}.evtitle .iic svg, .evtitle .iic img.art{width:28px;height:28px}
.tix{color:var(--brass);letter-spacing:2px;font-size:13px}
.tix span{color:rgba(255,255,255,.18)}
.bracketwrap{overflow-x:auto}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(80px,1fr));gap:6px;min-width:340px}
.bcol{display:grid;gap:4px;align-content:space-around}
.bk{font-size:11.5px;font-weight:700;background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:7px;padding:3px 6px;line-height:1.2;overflow-wrap:anywhere}
.bk.me{border-color:var(--brass);color:var(--brass)}
.bk.won{background:rgba(134,220,147,.14)}
.bk.lost{opacity:.45;text-decoration:line-through}
.sel{width:100%;max-width:100%;background:rgba(0,0,0,.35);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700}
.rwtable{display:grid;gap:3px;font-size:12.5px}
.rwtable div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:2px}
.rwtable .ok{color:var(--heal);font-weight:800}
.evlist{display:grid;gap:10px}
.evc{background:linear-gradient(180deg,#121c32,#0c1222);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.evc.open{border-color:var(--brass)}
.evhd{width:100%;background:none;border:0;display:flex;gap:10px;align-items:center;padding:12px;text-align:left}
.evhd .iic{width:44px;height:44px}.evhd .iic svg, .evhd .iic img.art{width:26px;height:26px}
.evhd .t{flex:1;min-width:0;display:grid;gap:4px}
.evhd .t b{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.15}
.evbody{padding:0 12px 14px;display:grid;gap:10px}
.left{font-size:12px;font-weight:800;color:#60d4fb}
.left.soon{color:var(--danger)}
.chipsrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.typechip{font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;border:1.5px solid var(--brass-dim);color:var(--brass);line-height:1.5}
.rulechip{font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;background:rgba(255,107,91,.15);border:1.5px solid #c0504a;color:#ffb4a8;line-height:1.5}
.tteam{display:flex;gap:6px;flex-wrap:wrap}
.tteam .ava{width:40px;height:40px}
.mil{display:grid;gap:8px}
.milrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.milc{background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:12px;font-weight:800;align-content:start}
.milc .meta{font-size:11px;font-weight:700}
.milc.ok{border-color:var(--brass)}
.milc.done{opacity:.55}
.upc{display:grid}
.upc > div{display:flex;justify-content:space-between;gap:2px 10px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.08);padding:6px 0;font-size:13px}
.bonusl{display:grid;gap:8px}
.bonusi{display:flex;gap:10px;align-items:center;background:rgba(127,200,255,.08);border:1.5px solid #3b6c96;border-radius:12px;padding:8px 10px}
.bonusi .iic{width:40px;height:40px}
.ghead{display:flex;gap:14px;align-items:center}.ghead svg, .ghead img.art{flex:none}
.gname{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid rgba(0,0,0,.4);padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--c)}
.mrow,.drow{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.mrow .ava,.drow .ava{width:38px;height:38px}
.mi{flex:1;min-width:0}
.mi b{font-family:var(--display);font-weight:800;overflow-wrap:anywhere}
.role{font-size:10.5px;font-weight:800;padding:0 6px;border-radius:999px;border:1.5px solid var(--brass-dim);color:var(--brass);margin-left:6px;vertical-align:middle}
.gbossbar{height:12px}
.gbossbar i{background:linear-gradient(180deg,#ff9a8a,#c0372a)}
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center}
.score .meta{overflow-wrap:anywhere}
.score b{font-family:var(--display);font-size:36px;line-height:1}
.score .us{color:var(--heal)} .score .them{color:var(--danger)}
.warbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(0,0,0,.4)}
.warbar i{display:block;background:var(--heal)}
.warbar s{display:block;background:var(--danger);text-decoration:none}
.dstars{color:var(--r5);letter-spacing:1px;white-space:nowrap}
.dstars span{color:rgba(255,255,255,.18)}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.shopi{background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;justify-items:start;align-content:start}
.glog{display:grid;gap:5px;font-size:13px}
.glog > div{display:flex;justify-content:space-between;gap:10px}
.glog .meta{white-space:nowrap}

<script>
const KEY='appel-tour-v1';
const CLASSES={

};
const LEGENDS={
  valdrik:{name:'Valdrik',title:'le Rempart d’airain',cls:'tank',el:'terre',seed:101,skin:'#c98e62',hair:'#b8b8c4',eye:'#3b6fb0',style:0,

  ilyas:{name:'Ilyas',title:'Œil du faucon',cls:'archer',el:'vent',seed:404,skin:'#e9bd94',hair:'#8b5a30',eye:'#4f8a4a',style:2,

  morgane:{name:'Morgane',title:'Astre noir',cls:'mage',el:'ombre',seed:505,skin:'#f7e1cf',hair:'#6c4a8c',eye:'#9a4fb8',style:3,
    skill:'Pluie d’étoiles',desc:'Sa 3ᵉ compétence inflige 160 % de son ATQ à tous les ennemis et peut briser leur DÉF. Recharge en 3 tours.'},
  aelis:{name:'Aelis',title:'Voix du sanctuaire',cls:'healer',el:'eau',seed:606,skin:'#74482a',hair:'#c99f60',eye:'#b8862a',style:4,
    skill:'Second souffle',desc:'Une fois par combat, ramène à la vie le premier allié qui tombe, avec 50 % de ses PV.'}
};

const ELEM={
  eau:{n:'Eau',c:'#5ab4ff',beats:'feu'},feu:{n:'Feu',c:'#ff7a45',beats:'vent'},
  vent:{n:'Vent',c:'#6fe0a0',beats:'terre'},terre:{n:'Terre',c:'#d9a85f',beats:'eau'},
  lumiere:{n:'Lumière',c:'#ffe27a',beats:'ombre'},ombre:{n:'Ombre',c:'#b991ff',beats:'lumiere'}
};
function randEl(){return Math.random()<.15?(Math.random()<.5?'lumiere':'ombre'):['eau','feu','vent','terre'][Math.floor(Math.random()*4)]}
function elemMul(a,b){if(!a||!b)return 1;if(ELEM[a].beats===b)return 1.3;if(ELEM[b].beats===a)return .8;return 1}
const SYN=[
  {k:'archer',name:'Volée',cls:'archer',tiers:[2,3],desc:['+8 % de dégâts pour les Archers','+15 % de dégâts pour les Archers']},
  {k:'tank',name:'Mur de boucliers',cls:'tank',tiers:[2,3],desc:['+15 % de DÉF pour toute l’équipe','+25 % de DÉF pour toute l’équipe']},
  {k:'warrior',name:'Fureur',cls:'warrior',tiers:[2,3],desc:['+10 % d’ATQ pour les Guerriers','+20 % d’ATQ pour les Guerriers']},
  {k:'mage',name:'Cercle arcanique',cls:'mage',tiers:[2,3],desc:['+20 % aux sorts de zone','+35 % aux sorts de zone']},
  {k:'healer',name:'Chœur sacré',cls:'healer',tiers:[2,3],desc:['+20 % de soins','+40 % de soins']},
  {k:'reso',name:'Résonance',tiers:[3,4],desc:['+10 % d’ATQ et de DÉF pour les héros de l’élément','+20 % d’ATQ et de DÉF pour les héros de l’élément']},
  {k:'harmonie',name:'Harmonie',tiers:[4],desc:['+8 % d’ATQ pour toute l’équipe']}
];
const BONDS=[
  {k:'aube',n:'Serment de l’aube',legs:['seren','aelis'],d:'Seren et Aelis ensemble : +10 % d’ATQ et de soins pour l’équipe'},
  {k:'meute',n:'Chasse sauvage',legs:['kaelen','ilyas'],d:'Kaelen et Ilyas ensemble : +8 % de taux critique pour l’équipe'},
  {k:'astres',n:'Astres jumeaux',legs:['morgane','seren'],d:'Morgane et Seren ensemble : +15 % aux sorts de zone, +5 % d’ATQ'},
  {k:'rempart',n:'Rempart sacré',legs:['valdrik','aelis'],d:'Valdrik et Aelis ensemble : +15 % de DÉF pour l’équipe'},
  {k:'braise',n:'Braise et ténèbres',legs:['kaelen','morgane'],d:'Kaelen et Morgane ensemble : +10 % de pénétration pour l’équipe'}
];
function teamSyn(heroes){
  const ec={};heroes.forEach(h=>ec[h.el]=(ec[h.el]||0)+1);
  const best=Object.entries(ec).sort((a,b)=>b[1]-a[1])[0];
  return SYN.map(d=>{
    let count,name=d.name,el=null;
    if(d.cls)count=heroes.filter(h=>h.cls===d.cls).length;
    else if(d.k==='reso'){count=best?best[1]:0;el=best?best[0]:null;if(el)name+=' · '+ELEM[el].n}
    else count=Object.keys(ec).length;
    return{...d,name,el,count,tier:d.tiers.filter(t=>count>=t).length};
  }).concat(BONDS.map(b=>{const count=b.legs.filter(l=>heroes.some(h=>h.leg===l)).length;return{k:'b_'+b.k,bond:true,name:b.n,desc:[b.d],tiers:[2],count,tier:count>=2?1:0,legs:b.legs}}));
}
function applySyn(units,syn){
  const t=k=>syn.find(s=>s.k===k).tier;
  units.forEach(u=>{u.atkMul=1;u.defMul=1;u.dmgMul=1;u.healMul=1;u.aoeMul=1});
  if(t('archer'))units.filter(u=>u.cls==='archer').forEach(u=>u.dmgMul*=t('archer')===2?1.15:1.08);
  if(t('tank'))units.forEach(u=>u.defMul*=t('tank')===2?1.25:1.15);
  if(t('warrior'))units.filter(u=>u.cls==='warrior').forEach(u=>u.atkMul*=t('warrior')===2?1.2:1.1);
  if(t('mage'))units.filter(u=>u.cls==='mage').forEach(u=>u.aoeMul=t('mage')===2?1.35:1.2);
  if(t('healer'))units.filter(u=>u.cls==='healer').forEach(u=>u.healMul=t('healer')===2?1.4:1.2);
  const r=syn.find(s=>s.k==='reso');
  if(r.tier)units.filter(u=>u.el===r.el).forEach(u=>{const b=r.tier===2?1.2:1.1;u.atkMul*=b;u.defMul*=b});
  if(t('harmonie'))units.forEach(u=>u.atkMul*=1.08);
  const on=k=>{const b=syn.find(s=>s.k==='b_'+k);return b&&b.tier};
  if(on('aube'))units.forEach(u=>{u.atkMul*=1.1;u.healMul*=1.1});
  if(on('meute'))units.forEach(u=>u.crit=(u.crit||5)+8);
  if(on('astres'))units.forEach(u=>{u.aoeMul*=1.15;u.atkMul*=1.05});
  if(on('rempart'))units.forEach(u=>u.defMul*=1.15);
  if(on('braise'))units.forEach(u=>u.pen=Math.min(80,(u.pen||0)+10));
}
const MELEE=c=>c==='tank'||c==='warrior';
function syncParty(){S.party=S.slots.filter(Boolean)}
function rowOf(id){const i=S.slots.indexOf(id);return i<0?null:i<3?'front':'back'}
function removeFromTeam(id){S.slots=S.slots.map(x=>x===id?null:x);if(S.eslots)for(const k in S.eslots)S.eslots[k]=S.eslots[k].map(x=>x===id?null:x);syncParty()}
const slotsOf=k=>k==='main'?S.slots:S.eslots[k];
/* Chef de formation : choisi par le joueur, sinon le premier héros placé */
function leadIdOf(sl){
  if(!sl)return null;
  if(typeof S!=='undefined'&&S){const fk=sl===S.slots?'main':Object.keys(S.eslots||{}).find(k=>S.eslots[k]===sl);
    if(fk){const id=(S.leads||{})[fk];if(id!=null&&sl.includes(id))return id;return sl.find(x=>x!=null)}}
  return sl[0];
}
const leadIdx=fk=>{const sl=slotsOf(fk),id=leadIdOf(sl);return id==null?-1:sl.indexOf(id)};
function setLead(i){const sl=slotsOf(fkey),id=sl[i];if(id==null)return;S.leads=S.leads||{};S.leads[fkey]=id;save();render();const h=heroById(id);toast(`${h.name} devient chef : ${leadText(leaderOf(h))}.`)}
function placeAuto(id){
  const h=heroById(id);if(!h||S.slots.includes(id)||inTrain(id)||S.slots.filter(Boolean).length>=5)return false;
  const pref=MELEE(h.cls)?[0,1,2,3,4,5]:[3,4,5,0,1,2],i=pref.find(i=>!S.slots[i]);
  if(i==null)return false;S.slots[i]=id;syncParty();return true;
}

const STAT={hp:'PV',def:'DÉF',atk:'ATQ',hpp:'PV %',defp:'DÉF %',atkp:'ATQ %',spd:'VIT',crit:'Taux crit',cdmg:'Dég. crit',pen:'Pénétration',acc:'Précision',res:'Résistance'};

const fmt=(k,v)=>`+${v}${PCT.has(k)?' %':''}`;
const RANK=['','D','C','B','A','S','SS'];
const rankTag=r=>`<span class="rank q${r}">${RANK[r]}</span>`;
const MAINPOOL=['hpp','defp','atkp','crit','cdmg','pen','acc','res','hp','def','atk'];
const SUBPOOL=['hpp','defp','atkp','spd','crit','cdmg','acc','res','hp','def','atk'];

/* ---------- Invocation ---------- */
function rollStar(){
  S.pity++;S.pulls++;
  if(S.pity>=PITY){S.pity=0;return 5}
  if(evBonus('summon5')&&R()<.02){S.pity=0;return 5}
  let r=R()*100;
  for(const x of RATES){if(r<x.p){if(x.s===5)S.pity=0;return x.s}r-=x.p}
  return 1;
}
function create(stars){
  if(stars===5){
    const key=pick(Object.keys(LEGENDS)),own=S.heroes.find(h=>h.leg===key);
    if(own){
      if(own.awk<AWK_MAX){const old=stats(own).hp;own.awk++;own.hp+=stats(own).hp-old;return{id:own.id,note:`Éveil ${own.awk}`}}
      S.gems+=300;return{id:own.id,note:'Éveil max · +300 ◆'};
    }
    const h=makeLegend(key);S.heroes.push(h);return{id:h.id,note:'Légendaire'};
  }
  const h=makeHero(stars);S.heroes.push(h);return{id:h.id,note:''};
}
function summon(n){
  const cost=n===10?COST10:COST1;
  if(S.gems<cost)return toast('Pas assez de cristaux.');
  S.gems-=cost;track('summon',n);
  const got=[];for(let i=0;i<n;i++)got.push(rollStar());
  if(n===10&&!got.some(s=>s>=3))got[9]=3;
  if(n===10&&S.pulls===10&&!got.some(s=>s>=4))got[9]=4;
  lastPull=got.map(create);
  save();render();
  const leg=lastPull.find(x=>x.note),items=lastPull.map((x,i)=>({h:heroById(x.id),st:got[i],note:x.note}));
  const done=()=>{if(got.includes(5)&&leg){const h=heroById(leg.id);if(h)toast(leg.note==='Légendaire'?`${h.name}, ${LEGENDS[h.leg].title}, répond à votre appel !`:`${h.name} s’éveille davantage.`)}};
  if(S.settings&&S.settings.sumfx===false){sfx(got.includes(5)?'legend':'summon');done()}else sumPlay(items,done);
}

  const names=NAMES.filter(n=>n!==h.name).sort(()=>R()-.5).slice(0,15);
  const U=[me,...names.map(n=>{const a=aiUnit(n,s,.6+R()*.75);return{side:'f',name:a.n,cls:a.cls,el:a.el,hp:a.hp,max:a.hp,atk:a.atk,def:a.def,spd:a.spd,crit:a.crit,cdmg:a.cdmg,pen:a.pen,alive:true}})];
  const ev=[],log=(t,c)=>ev.push({t,c,hp:U.map(u=>u.hp)}),out=[],live=()=>U.filter(u=>u.alive);
  function strike(a,t,m){
    if(!t.alive)return;
    const crit=R()<a.crit/100,em=elemMul(a.el,t.el);
    const d=Math.max(1,Math.round(a.atk*m*em*(.9+R()*.2)*(crit?a.cdmg/100:1)-t.def*(1-a.pen/100)*.5));
    t.hp=Math.max(0,t.hp-d);
    if(a===me||t===me)log(`${a.name} frappe ${t.name} : −${d}${crit?' (critique)':''}${em>1?' (efficace)':''}`,a===me?'hit-h':'hit-f');
    if(t.hp===0){t.alive=false;out.push(t);log(`${a.name} élimine ${t.name}. ${live().length} en lice.`,t===me?'death':a===me?'kill':'sys')}
  }
  log('16 champions entrent dans l’arène. Il ne peut en rester qu’un.','sys');
  for(let round=1;round<=40&&live().length>1;round++){
    const order=live().map(u=>({u,k:u.spd+R()*4})).sort((a,b)=>b.k-a.k).map(o=>o.u);
    for(const u of order){
      if(!u.alive)continue;const others=live().filter(x=>x!==u);if(!others.length)break;
      if(u.cls==='healer'&&u.hp<u.max*.5&&R()<.5){const v=Math.round(u.max*.2);u.hp=Math.min(u.max,u.hp+v);if(u===me)log(`${u.name} se soigne : +${v}`,'heal');continue}
      if(u.cls==='mage'&&R()<.4){others.sort(()=>R()-.5).slice(0,2).forEach(t=>strike(u,t,.7));continue}
      const weak=others.slice().sort((a,b)=>a.hp-b.hp)[0];
      strike(u,R()<.3?weak:pick(others),u.cls==='archer'?1.1:1);
    }
    if(round>=4&&live().length>1){
      const pct=.06*(round-3);log(`La tempête se resserre : −${Math.round(pct*100)} % des PV max pour tous.`,'sys');
      live().forEach(u=>{u.hp=Math.max(0,u.hp-Math.ceil(u.max*pct));if(u.hp===0){u.alive=false;out.push(u);log(`${u.name} est emporté par la tempête.`,u===me?'death':'sys')}});
    }
  }
  const ranking=[...live().sort((a,b)=>b.hp/b.max-a.hp/a.max),...out.slice().reverse()],rank=ranking.indexOf(me)+1;
  log(rank===1?`${me.name} est le dernier debout !`:`${me.name} termine ${rank}ᵉ sur 16.`,rank===1?'win':'lose');
  return{U,ev,rank};
}
function eligible(def){return sortedHeroes().filter(h=>!inTrain(h.id)&&ruleOk(h,def.rule))}
function evPlay(id){
  const inst=findInst(id);if(!inst){toast('Cet événement est terminé.');render();return}
  if(busy)return;const def=inst.def,p=evp(inst);
  if(def.type==='tour')return playTourEv(inst);
  if(def.type==='royale'){
    const pool=eligible(def),h=pool.find(x=>x.id===royaleSel)||pool[0];
    if(!h)return toast(`Aucun héros éligible (${ruleLabel(def.rule).toLowerCase()}).`);
    if(!useTicket(inst))return;
    const r=royaleSim(h),sum={label:def.n,win:r.rank===1,fallen:[],levels:[],gems:0,gold:0,loot:[],head:r.rank===1?`${h.name} remporte ${def.n.toLowerCase()} !`:`${h.name} termine ${r.rank}ᵉ sur 16`};
    give(royaleReward(r.rank,def),sum);p.best=p.best?Math.min(p.best,r.rank):r.rank;
    return evEnd(sum,inst,{win:r.rank===1,ev:r.ev,U:r.U},r.rank===1?100:r.rank<=3?60:r.rank<=5?40:r.rank<=10?20:10);
  }
  const team=evTeam(def);
  if(!team.list.length)return toast(def.rule?`Aucun héros éligible (${ruleLabel(def.rule).toLowerCase()}).`:'Votre formation est vide.');
  if(def.type==='raid'){
    if(!useTicket(inst))return;
    const b=baseOf(team.list),d=def.diff||1;
    const boss={n:def.boss,hp:RAID_HP,atk:Math.round((b.hp*.16+b.def*.6)*d),def:Math.round(b.def*.8*d),spd:8,boss:true,el:def.el||randEl(),crit:10,cdmg:150,pen:20};
    const res=simulate(team.list,[boss],team.slots,12);
    const dmg=RAID_HP-res.U.find(u=>u.side==='f').hp,tier=RAID_TIERS.filter(t=>dmg>=t.d).length,T=RAID_TIERS[tier-1];
    const sum={label:def.n,win:true,fallen:[],levels:[],gems:0,gold:0,loot:[],head:`${dmg.toLocaleString('fr-FR')} dégâts infligés : ${def.boss}`};
    give(scaleR(tier?{gems:T.g,gold:T.o,shards:T.s}:{gems:10,gold:100,shards:0},def.rw||1),sum);
    p.best=Math.max(p.best||0,dmg);sum.note=`Palier ${tier}/${RAID_TIERS.length}`;
    return evEnd(sum,inst,res,10+tier*25);
  }
  if(def.type==='survie'){

      wave++;
      const count=Math.min(5,3+Math.floor(wave/4)),foes=Array.from({length:count},()=>aiUnit(pick(def.foes),base,(.45+.085*wave)*(def.diff||1)));
      const res=simulate(list,foes,team.slots);last=res;
      res.U.filter(u=>u.side==='h').forEach(u=>{const c=list.find(x=>x.id===u.id);if(c)c.hp=Math.round(u.hp/(u.hpMul||1))});
      list=list.filter(x=>x.hp>0);
      if(!res.win||!list.length)break;
      list.forEach(c=>{const mx=stats(c).hp;c.hp=Math.min(mx,c.hp+Math.round(mx*.2))});
    }
    const cleared=last&&last.win?wave:wave-1;
    const sum={label:`${def.n} · vague ${wave}`,win:last.win,fallen:[],levels:[],gems:0,gold:0,loot:[],head:`${cleared} vague${cleared>1?'s':''} repoussée${cleared>1?'s':''}`};
    give(scaleR({gems:5*cleared,gold:120*cleared,shards:Math.floor(cleared/3)},evMult()*(def.rw||1)),sum);
    p.best=Math.max(p.best||0,cleared);sum.note=`Record de l’événement : ${p.best} vagues`;
    return evEnd(sum,inst,last,cleared*10);
  }
  if(def.type==='tresor'){
    if(!useTicket(inst))return;
    const res=simulate(team.list,aiTeam(baseOf(team.list),.95*(def.diff||1),['Gardien du trésor','Sentinelle dorée','Mimique','Golem de coffre','Esprit avare']),team.slots);
    const sum={label:def.n,win:res.win,fallen:[],levels:[],gems:0,gold:0,loot:[],head:res.win?'Trésor récupéré !':'Les gardiens vous repoussent'};
    if(res.win){const r=evItem(def.slots,def.minRank);if(r.it)sum.loot.push(r.it.id);if(r.sold)sum.sold=r.sold;give(scaleR({gems:15,gold:400,shards:3},evMult()*(def.rw||1)),sum)}
    else give({gems:10,gold:150,shards:0},sum);
    return evEnd(sum,inst,res,res.win?40:10);
  }
}

const warX=w=>Math.max(0,Math.min(1,(Date.now()-dayDate(w.day).getTime())/DAY));

async function initGuildOnline(){

  const fail=()=>{if(GO.status!=='online'){GO.status='offline';goRefresh()}};

    GO.db.collection('guilds').onSnapshot(sn=>{GO.guilds=sn.docs.map(d=>({id:d.id,...d.data()}));GO.ok.g=true;ready()},fail);

const PVP_BUDGET=17,PVP_LVL=25,PVP_BOTS=7,PVP_EDITS=3;
const LAWS=[
  {k:'none',n:'Loi de l’équilibre',d:'Aucune règle spéciale.'},
  {k:'soins',n:'Loi des sources',d:'Tous les soins sont doublés.'},
  {k:'crit',n:'Loi du tranchant',d:'+25 % de taux critique pour tout le monde.'},
  {k:'lent',n:'Loi de la tortue',d:'Les unités les plus lentes agissent en premier.'},
  {k:'fragile',n:'Loi du verre',d:'Tout le monde commence avec 40 % de PV en moins.'},
  {k:'mur',n:'Loi du rempart',d:'La DÉF de tout le monde est doublée.'},
  {k:'elem',n:'Loi des éléments',d:'Avantages élémentaires renforcés : +60 % / −40 %.'}

let PV={status:'init',db:null,user:null,uid:null,canWrite:true,docs:[],names:{},cache:new Map(),stand:new Map(),writing:false};
function withSeed(seed,fn){const o=RNG;RNG=rng(seed);try{return fn()}finally{RNG=o}}
function pvpLaw(d){return LAWS[Math.floor(rng(d*7717+3)()*LAWS.length)]}
function pvpPool(d){
  const r=rng(d*1009+7),cls=['tank','warrior','archer','mage','healer'];
  const cl=[...cls,...cls,...cls,cls[Math.floor(r()*5)],cls[Math.floor(r()*5)],cls[Math.floor(r()*5)]];
  const st=[5,5,5,4,4,4,4,3,3,3,3,3,3,2,2,2,2,2];
  for(const a of [cl,st])for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const els=['eau','feu','vent','terre','eau','feu','vent','terre','lumiere','ombre'];
  const pools={};Object.keys(CLASSES).forEach(c=>{pools[c]=namesOf(c).sort(()=>r()-.5)});
  return cl.map((c,i)=>({idx:i,name:pools[c].shift()||namesOf(c)[0],cls:c,stars:st[i],el:els[Math.floor(r()*els.length)],seed:Math.floor(r()*1e9)}));
}
const PVP_POOL=18,PVP_HAND=8;
/* Tirage personnel : chaque joueur reçoit 8 mercenaires parmi les 18 du jour */
function pvpHand(d,key){
  const pool=pvpPool(d),r=rng(d*7919+Math.abs(hash(String(key)))%100000),pickN=(arr,n)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};
  const hi=pool.filter(u=>u.stars>=4).map(u=>u.idx),mid=pool.filter(u=>u.stars===3).map(u=>u.idx),lo=pool.filter(u=>u.stars<=2).map(u=>u.idx);
  return[...pickN(hi,3),...pickN(mid,3),...pickN(lo,2)].sort((a,b)=>a-b);
}
const myPvpKey=()=>PV.status==='online'&&PV.uid?PV.uid:'me';
const pvpCost=(d,dr)=>dr.p.reduce((t,i)=>t+pvpPool(d)[i].stars,0);
function validDraft(d,dr,key){
  if(!dr||!Array.isArray(dr.p)||!Array.isArray(dr.b)||dr.p.length!==5)return false;
  if(new Set(dr.p).size!==5||dr.p.some(i=>!Number.isInteger(i)||i<0||i>=PVP_POOL))return false;
  if(key!=null){const h=pvpHand(d,key);if(dr.p.some(i=>!h.includes(i)))return false}
  const back=dr.b.filter(i=>dr.p.includes(i));
  return back.length<=3&&5-back.length<=3&&pvpCost(d,dr)<=PVP_BUDGET;
}
function buildTeam(d,dr,pre){
  const pool=pvpPool(d),list=[],slots=[null,null,null,null,null,null];
  dr.p.forEach(i=>{const u=pool[i],h={id:pre+'_'+i,name:u.name,cls:u.cls,el:u.el,stars:u.stars,lvl:PVP_LVL,awk:0,noBonus:true,seed:u.seed};h.hp=stats(h).hp;list.push(h)});
  let f=0,b=3;list.forEach((h,k)=>{const back=dr.b.includes(dr.p[k]);if(back)slots[b++]=h.id;else slots[f++]=h.id});
  return{list,slots};
}
function botDraft(d,k){
  const r=rng(d*331+k*97+5),pool=pvpPool(d),hd=pvpHand(d,'bot'+k);let best=null,bs=-1;
  for(let t=0;t<60;t++){
    const p=hd.slice().sort(()=>r()-.5).slice(0,5);
    const dr={p,b:p.filter(i=>!MELEE(pool[i].cls))};
    if(dr.b.length>3)dr.b=dr.b.slice(0,3);
    if(5-dr.b.length>3){const extra=p.filter(i=>!dr.b.includes(i)).slice(0,(5-dr.b.length)-3);dr.b.push(...extra)}
    if(!validDraft(d,dr,'bot'+k))continue;
    const sc=pvpCost(d,dr)+r()*3+teamSyn(dr.p.map(i=>pool[i])).reduce((t,s)=>t+s.tier,0);
    if(sc>bs){bs=sc;best=dr}
  }
  return best;
}
const BOT_NAMES=['Ombre de Kaito','Ombre d’Akane','Ombre de Grimm','Ombre de Liora','Ombre de Torvald','Ombre de Yumi','Ombre de Skarr','Ombre de Naïa','Ombre de Valt'];
function pvpLocal(){
  const d=dayIdx();S.pvp=S.pvp||{day:d,work:{p:[],b:[]},sub:null,edits:0};
  if(S.pvp.day!==d)S.pvp={day:d,work:{p:[],b:[]},sub:null,edits:0,prevDay:S.pvp.sub?S.pvp.day:(S.pvp.prevDay===d-1?S.pvp.prevDay:null),prev:S.pvp.sub||(S.pvp.prevDay===d-1?S.pvp.prev:null)};
  return S.pvp;
}
function pvpEntries(d){
  const out=[];for(let i=0;i<PVP_BOTS;i++){const dr=botDraft(d,i);if(dr)out.push({id:'bot'+i,bot:true,name:BOT_NAMES[(d+i)%BOT_NAMES.length],draft:dr})}
  if(PV.status==='online'){
    for(const doc of PV.docs){const dr=doc.day===d?doc.draft:doc.prevDay===d?doc.prev:null;if(dr&&validDraft(d,dr,doc.id))out.push({id:doc.id,me:doc.id===PV.uid,draft:dr,p:typeof doc.p==='string'?doc.p.slice(0,20):''})}
  }else{const L=pvpLocal(),dr=L.day===d?L.sub:L.prevDay===d?L.prev:null;if(dr)out.push({id:'me',me:true,draft:dr})}
  return out;
}
function pvpGame(d,A,B,g){
  const key=`${d}|${A.id}|${JSON.stringify(A.draft)}|${B.id}|${JSON.stringify(B.draft)}|${g}`;
  if(PV.cache.has(key))return PV.cache.get(key);
  const ta=buildTeam(d,A.draft,'a'),tb=buildTeam(d,B.draft,'b'),law=pvpLaw(d).k;
  const res=withSeed(hash(key),()=>simulate(ta.list,tb.list,ta.slots,25,{foeHeroes:true,foeSlots:tb.slots,mut:law}));
  const aAlive=res.U.some(u=>u.side==='h'&&u.alive),bAlive=res.U.some(u=>u.side==='f'&&u.alive);
  let out=res.win?'A':(!aAlive&&bAlive)?'B':'=';
  if(out==='='){const ratio=side=>{const us=res.U.filter(u=>u.side===side);return us.reduce((t,u)=>t+u.hp,0)/Math.max(1,us.reduce((t,u)=>t+u.max,0))};const ra=ratio('h'),rb=ratio('f');if(Math.abs(ra-rb)>.005)out=ra>rb?'A':'B'}
  PV.cache.set(key,out);return out;
}
function pvpMatch(d,A,B){const g1=pvpGame(d,A,B,1),g2=pvpGame(d,B,A,2);let a=(g1==='A'?1:0)+(g2==='B'?1:0),b=(g1==='B'?1:0)+(g2==='A'?1:0);return{a,b}}
function pvpStandings(d){
  const E=pvpEntries(d),sig=d+'|'+E.map(e=>e.id+JSON.stringify(e.draft)).join(';');
  if(PV.stand.has(sig))return PV.stand.get(sig);
  const T=E.map(e=>({...e,pts:0,w:0,dr:0,l:0,res:{}}));
  for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){
    const m=pvpMatch(d,T[i],T[j]);T[i].res[T[j].id]=[m.a,m.b];T[j].res[T[i].id]=[m.b,m.a];
    if(m.a>m.b){T[i].pts+=3;T[i].w++;T[j].l++}else if(m.b>m.a){T[j].pts+=3;T[j].w++;T[i].l++}else{T[i].pts+=1;T[j].pts+=1;T[i].dr++;T[j].dr++}
  }
  T.sort((x,y)=>y.pts-x.pts||y.w-x.w||hash(x.id)-hash(y.id));
  if(PV.stand.size>20)PV.stand.clear();PV.stand.set(sig,T);return T;
}

/* ---------- Arène royale (PvP permanent) ----------
   Chaque jour, chaque joueur inscrit un champion parmi ses héros. Tous les champions
   s'affrontent dans une mêlée générale avec une tempête qui se resserre ; le classement
   se fige à minuit. Les données vivent dans le document Draft du joueur (champ roy). */
const ROY_FIELD=12,ROY_EDITS=3,ROY_BOTS=['Ombre écarlate','Ombre d’azur','Ombre de jade','Ombre d’ambre','Ombre d’onyx','Ombre d’argent','Ombre de nacre','Ombre de cendre','Ombre d’opale','Ombre de givre','Ombre d’airain'];
const RY={stand:new Map()};

function royLocal(){const d=dayIdx();S.roy=S.roy||{day:d,sub:null,edits:0};if(S.roy.day!==d)S.roy={day:d,sub:null,edits:0,prevDay:S.roy.sub?S.roy.day:(S.roy.prevDay===d-1?S.roy.prevDay:null),prev:S.roy.sub||(S.roy.prevDay===d-1?S.roy.prev:null)};return S.roy}
function royCard(h){const s=stats(h);return{t:tierOf(myRp()),name:h.name,cls:h.cls,el:h.el,leg:h.leg||null,seed:h.seed,stars:h.stars,lvl:h.lvl,awk:h.awk||0,st:{hp:s.hp,atk:s.atk,def:s.def,spd:s.spd,crit:s.crit,cdmg:s.cdmg,pen:s.pen}}}
const royValid=c=>c&&CLASSES[c.cls]&&c.st&&[c.st.hp,c.st.atk,c.st.def,c.st.spd].every(v=>Number.isFinite(v)&&v>0&&v<1e7);
function royEntries(d,t){
  const out=[];
  if(PV.status==='online'){for(const doc of PV.docs){const c=doc.roy&&doc.roy.day===d?doc.roy.h:doc.royPrev&&doc.royPrev.day===d?doc.royPrev.h:null;if(royValid(c))out.push({id:doc.id,me:doc.id===PV.uid,p:typeof doc.p==='string'?doc.p.slice(0,20):'',c})}}

  return t==null?out:out.filter(e=>(e.c.t||0)===t);
}
function royName(e){return e.me?'Vous':e.bot?e.name:(e.p||PV.names[e.id]||'Joueur')}
function royFight(d,t){
  if(t==null)t=myRoyTier(d);
  const E=royEntries(d,t),sig=d+'|'+t+'|'+E.map(e=>e.id+JSON.stringify(e.c.st)).join(';');
  if(RY.stand.has(sig))return RY.stand.get(sig);
  const res=withSeed(hash('roy'+sig),()=>{
    const players=E.map(e=>({...e,name:e.c.name,cls:e.c.cls,el:e.c.el,hp:e.c.st.hp,max:e.c.st.hp,atk:e.c.st.atk,def:e.c.st.def,spd:e.c.st.spd,crit:e.c.st.crit||5,cdmg:e.c.st.cdmg||150,pen:e.c.st.pen||0,alive:true}));
    const tb=1+.12*t,avg=players.length?{hp:players.reduce((t,u)=>t+u.max,0)/players.length,atk:players.reduce((t,u)=>t+u.atk,0)/players.length,def:players.reduce((t,u)=>t+u.def,0)/players.length,spd:11,crit:10,cdmg:160,pen:5}:{hp:300,atk:40,def:15,spd:11,crit:10,cdmg:160,pen:5};
    const els=['eau','feu','vent','terre','lumiere','ombre'],bots=[];
    for(let i=0;players.length+bots.length<ROY_FIELD;i++){const a=aiUnit(pick(NAMES),avg,(.42+R()*.3)*(players.length?1:tb));bots.push({id:'rb'+i,bot:true,name:ROY_BOTS[(d+i)%ROY_BOTS.length],cname:a.n,cls:a.cls,el:els[Math.floor(R()*6)],hp:a.hp,max:a.hp,atk:a.atk,def:a.def,spd:a.spd,crit:a.crit||5,cdmg:a.cdmg||150,pen:a.pen||0,alive:true,c:{name:a.n,cls:a.cls,stars:3,seed:Math.floor(R()*1e9)}})}
    const U=[...players,...bots],out=[],log=[],live=()=>U.filter(u=>u.alive),me=U.find(u=>u.me);
    U.forEach(u=>{u.kills=0});
    const who=u=>`${u.c?u.c.name:u.name} (${royName(u)})`;
    function strike(a,t,m){
      if(!t.alive)return;const crit=R()<a.crit/100,em=elemMul(a.el,t.el);
      const dmg=Math.max(1,Math.round(a.atk*m*em*(.9+R()*.2)*(crit?a.cdmg/100:1)-t.def*(1-a.pen/100)*.5));
      t.hp=Math.max(0,t.hp-dmg);if(me&&(a===me||t===me))log.push({c:a===me?'hit-h':'hit-f',t:`${who(a)} frappe ${who(t)} : −${dmg}${crit?' (critique)':''}`});
      if(t.hp===0){t.alive=false;a.kills++;out.push(t);log.push({c:t===me?'death':a===me?'kill':'sys',t:`${who(a)} élimine ${who(t)}. ${live().length} en lice.`})}
    }
    log.push({c:'sys',t:`${U.length} champions entrent dans l’arène royale. Il ne peut en rester qu’un.`});
    for(let round=1;round<=40&&live().length>1;round++){
      const order=live().map(u=>({u,k:u.spd+R()*4})).sort((a,b)=>b.k-a.k).map(o=>o.u);
      for(const u of order){
        if(!u.alive)continue;const others=live().filter(x=>x!==u);if(!others.length)break;
        if(u.cls==='healer'&&u.hp<u.max*.5&&R()<.5){u.hp=Math.min(u.max,u.hp+Math.round(u.max*.2));continue}
        if(u.cls==='mage'&&R()<.4){others.sort(()=>R()-.5).slice(0,2).forEach(t=>strike(u,t,.7));continue}
        if(u.cls==='tank'&&R()<.25){u.hp=Math.min(u.max,u.hp+Math.round(u.max*.08));strike(u,pick(others),.8);continue}
        const weak=others.slice().sort((a,b)=>a.hp-b.hp)[0];strike(u,R()<.3?weak:pick(others),u.cls==='archer'?1.1:u.cls==='warrior'?1.05:1);
      }
      if(round>=4&&live().length>1){const pct=.05*(round-3);log.push({c:'sys',t:`La tempête se resserre : −${Math.round(pct*100)} % des PV max pour tous.`});
        live().forEach(u=>{u.hp=Math.max(0,u.hp-Math.ceil(u.max*pct));if(u.hp===0){u.alive=false;out.push(u);log.push({c:u===me?'death':'sys',t:`${who(u)} est emporté par la tempête.`})}})}
    }
    const rk=[...live().sort((a,b)=>b.hp/b.max-a.hp/a.max),...out.slice().reverse()];
    if(rk[0])log.push({c:rk[0]===me?'win':'sys',t:`${who(rk[0])} est le dernier debout !`});
    return{rank:rk.map(u=>({id:u.id,me:!!u.me,bot:!!u.bot,name:u.name,p:u.p,c:u.c,kills:u.kills})),log};
  });
  if(RY.stand.size>12)RY.stand.clear();RY.stand.set(sig,res);return res;
}
function royReward(rank,n,t=0){const top=rank/n,m=1+.25*t,r=rank===1?{gems:350,shards:25,tomes:1,rp:30}:rank<=3?{gems:220,shards:15,rp:20}:top<=.5?{gems:120,shards:6,rp:10}:{gems:50,shards:0,rp:t>=2?-8:4};
  return{gems:Math.round(r.gems*m),shards:Math.round(r.shards*m),tomes:r.tomes?r.tomes+(t>=3?1:0):0,rp:r.rp}}
async function royRegister(id){
  const h=heroById(id);if(!h||busy)return;const L=royLocal(),d=L.day;

        else await PV.db.collection('drafts').doc(PV.uid).set({roy:{day:d,h:c},p:(S.settings&&S.settings.name)||null,sp:0,day:null,draft:null,lb:lbData()})}
    catch(e){PV.writing=false;return toast('Inscription impossible pour le moment. Réessayez.')}

}
async function royClaim(){
  const d=dayIdx()-1;if(S.royClaimed===d)return;

let royShowLog=false;

/* ---------- RTA : arène en temps réel (choix 1-2-2-2-2-1, 1 bannissement, combat manuel synchronisé) ---------- */
const RTA_POOL=15,RTA_PICK_MS=30000,RTA_BAN_MS=20000,RTA_TURN_MS=30000,RTA_AFK_MS=75000,RTA_BOT_MS=30000;
const RTA_SEQ=['A','B','B','A','A','B','B','A','A','B'];
let RT={st:'idle',ignore:new Set()},rtaIdleSent=false;
function rtaInit(){if(!S.rta)S.rta={pts:0,w:0,l:0,fw:-1}}
const rtaPts=()=>(S&&S.rta&&S.rta.pts)||0;
const hPow=s=>Math.round(s.hp*.5+s.atk*4+s.def*3+s.spd*20);
function rtaCard(h,i){const s=stats(h);return{k:i,name:h.name,cls:h.cls,el:h.el,leg:h.leg||null,seed:h.seed||0,stars:h.stars,lvl:h.lvl,skl:(h.skl||[1,1,1]).slice(0,3),rc:{hp:s.hp,atk:s.atk,def:s.def,spd:s.spd,crit:s.crit,cdmg:s.cdmg,pen:s.pen,acc:s.acc||0,res:s.res==null?15:s.res},eff:setEffOf(h),pw:hPow(s)}}

/* ---------- Chat global ---------- */
const CHAT_KEEP=40,CHAT_MAX=200;
let CH={status:'init',db:null,user:null,uid:null,canWrite:true,owner:false,docs:[],names:{},open:false,lastSeen:0,writing:false,lastSend:0,online:0};
try{CH.lastSeen=Number(localStorage.getItem('appel-chat-seen'))||0}catch(e){}
async function initChat(){
  if(CH.status!=='init')return;CH.status='loading';chatRender();
  try{
    if(window.claude&&claude.use){
      const [db,user,room]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('room')]);
      CH.db=db;CH.user=user;
      if(user){CH.uid=await user.id();const c=await user.can('data.write');CH.canWrite=c!==false;CH.owner=await user.isOwner()}
      if(room){try{room.presence({here:true}).catch(()=>{});room.onPeers(ch=>{CH.online=ch.peers.filter(p=>p.kind==='viewer').length;chatRender()},()=>{})}catch(e){}}
    }
  }catch(e){}
  if(!CH.db||!CH.uid){CH.status='offline';chatRender();return}
  const timer=setTimeout(()=>{if(CH.status==='loading'){CH.status='slow';chatRender()}},10000);
  CH.db.collection('chat').onSnapshot(snap=>{
    if(!snap.metadata.fromCache)clearTimeout(timer);
    CH.status='online';CH.docs=snap.docs.map(x=>({id:x.id,...x.data()}));chatNames();chatRender();
  },()=>{clearTimeout(timer);CH.status='offline';chatRender()});
}
async function chatNames(){
  if(!CH.user)return;const ids=CH.docs.map(x=>x.id).filter(id=>id!==CH.uid);if(!ids.length)return;
  const ps=await CH.user.profiles(ids);let ch=false;
  for(const id of ids){const n=(ps[id]&&ps[id].name)||'';if(CH.names[id]!==n){CH.names[id]=n;ch=true}}
  if(ch)chatRender();
}
function chatMsgs(){
  const out=[];
  for(const d of CH.docs){if(!Array.isArray(d.msgs))continue;for(const m of d.msgs){if(m&&typeof m.x==='string'&&typeof m.t==='number')out.push({uid:d.id,g:typeof d.g==='string'?d.g:'',p:typeof d.p==='string'?d.p.slice(0,20):'',t:m.t,x:m.x.slice(0,CHAT_MAX)})}}
  return out.sort((a,b)=>a.t-b.t).slice(-120);
}
function chatNote(t){const el=document.getElementById('chatnote');if(el)el.textContent=t}
function chatTime(t){const d=new Date(t),now=new Date();const hm=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});return d.toDateString()===now.toDateString()?hm:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+hm}
function chatRender(){
  const fab=document.getElementById('chatfab');if(!fab)return;

  const st=document.getElementById('chatstatus');
  st.textContent=CH.status==='online'?(CH.online?` · ${CH.online} en ligne`:' · en direct'):CH.status==='offline'?' · hors ligne':CH.status==='slow'?' · connexion lente…':' · connexion…';
  const form=document.getElementById('chatform'),inp=document.getElementById('chatin');
  const canSend=CH.status==='online'&&CH.canWrite;inp.disabled=!canSend;form.querySelector('button').disabled=!canSend;
  inp.placeholder=CH.status==='offline'?'Chat indisponible : connectez-vous sur claude.ai':!CH.canWrite?'Lecture seule sur ce partage':'Écrire un message…';

  const list=document.getElementById('chatlist'),atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<60;
  list.innerHTML=msgs.length?msgs.map(m=>{const mine=m.uid===CH.uid,name=mine?'Vous':(m.p||CH.names[m.uid]||'Joueur');
    return`<div class="cmsg${mine?' mine':''}"><div class="cmeta"><b>${esc(name)}</b>${m.g?` <span class="role">${esc(m.g)}</span>`:''} <span class="meta">${chatTime(m.t)}</span>${CH.owner?` <button class="cdel" data-act="chatdel" data-id="${m.uid}|${m.t}" aria-label="Supprimer ce message">Supprimer</button>`:''}</div><div class="ctext">${esc(m.x)}</div></div>`}).join('')
    :`<p class="empty" style="padding:12px">${CH.status==='online'?'Aucun message pour l’instant. Lancez la conversation !':CH.status==='offline'?'Le chat a besoin d’une connexion à claude.ai pour fonctionner.':'Chargement des messages…'}</p>`;
  if(atBottom||list.dataset.first!=='1'){list.scrollTop=list.scrollHeight;list.dataset.first='1'}
  if(msgs.length){CH.lastSeen=Math.max(CH.lastSeen,msgs[msgs.length-1].t);try{localStorage.setItem('appel-chat-seen',String(CH.lastSeen))}catch(e){}}

async function chatSend(){
  const inp=document.getElementById('chatin'),txt=(inp.value||'').replace(/\s+/g,' ').trim().slice(0,CHAT_MAX);

async function chatDel(key){
  if(!CH.owner||CH.writing)return;const [uid,t]=key.split('|'),doc=CH.docs.find(x=>x.id===uid);if(!doc)return;

let CLOUD={status:'init',ref:null,timer:null,writing:false,pending:false,last:0,remote:null,warned:false};
const progressOf=s=>s?((s.best||0)*1000+(s.pulls||0)*5+(s.heroes?s.heroes.length:0)+(s.guild?500:0)):0;
const isFresh=s=>!s||((s.best||0)===0&&(s.pulls||0)===0&&!s.guild);
function parseSave(t){try{const o=typeof t==='string'?JSON.parse(t):t;return o&&Array.isArray(o.heroes)?o:null}catch(e){return null}}
async function cloudInit(){
  if(CLOUD.status!=='init')return;CLOUD.status='loading';
  try{if(window.claude&&claude.use){const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(db&&user){const uid=await user.id();if(uid)CLOUD.ref=db.doc('data/users/'+uid+'/save')}}}catch(e){}
  if(!CLOUD.ref){CLOUD.status='off';settingsRefresh();return}
  let snap=null;try{snap=await CLOUD.ref.get()}catch(e){CLOUD.status='err';settingsRefresh();return}
  CLOUD.status='on';
  if(snap.exists){
    const d=snap.data(),rs=parseSave(d.data);CLOUD.remote=d;CLOUD.last=d.savedAt||0;
    if(rs&&(d.savedAt||0)>(S.savedAt||0)+2000&&progressOf(rs)!==progressOf(S)){
      if(isFresh(S))return adoptSave(rs,'Sauvegarde en ligne chargée. Bon retour !');
      CLOUD.status='conflict';return showConflict(rs,d);
    }
  }
  cloudPush();settingsRefresh();
}

async function cloudPush(){

  const data=JSON.stringify(S);

function tone(f,d,type,v,slide,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}

function musicStart(){
  const a=ac();if(!a)return;const g=a.createGain();g.gain.value=.03;g.connect(a.destination);
  const prog=[[220,262,330],[175,220,262],[196,247,294],[165,208,247]],beat=.34;let step=0,next=a.currentTime+.1;
  const tick=()=>{while(next<a.currentTime+.7){

    o.type='triangle';o.frequency.value=f;e.gain.setValueAtTime(.0001,next);e.gain.exponentialRampToValueAtTime(1,next+.02);e.gain.exponentialRampToValueAtTime(.0001,next+beat*.9);o.connect(e).connect(g);o.start(next);o.stop(next+beat);

const refillCost=()=>refillUsed()>=REFILL_N?null:50+25*refillUsed();
function refillEnergy(){
  tickEnergy();const c=refillCost();
  if(c==null)return toast(`Déjà ${REFILL_N} recharges aujourd’hui. Revenez demain !`);
  if(S.gems<c)return toast('Pas assez de cristaux.');

  if(!refillAsk){refillAsk=true;render();setTimeout(()=>{if(refillAsk){refillAsk=false;render()}},4000);return}
  refillAsk=false;S.gems-=c;giveEnergy(REFILL_E);S.refill={d:dayIdx(),n:refillUsed()+1};sfx('heal');save();render();
  toast(`+${REFILL_E} énergie pour ${c} cristaux (${refillUsed()}/${REFILL_N} aujourd’hui).`);
}
function dailyMissions(){

  }
  return S.dm;
}

/* ---------- Farm automatique ---------- */
const AFK_MS=10*60000,AFK_MAX=72;
const afkReward=f=>{const m=evBonus('afk')?2:1;return{gems:(1+Math.floor(f/40))*m,gold:(50+f*12)*m*goldMul()}};
function afkClears(){if(!S.best){S.afkT=Date.now();return 0}return Math.max(0,Math.min(AFK_MAX,Math.floor((Date.now()-S.afkT)/AFK_MS)))}
function claimAfk(){
  const n=afkClears();if(n<1)return toast('Aucune victoire automatique pour l’instant.');
  const r=afkReward(S.best),g=n*r.gems,o=n*r.gold;
  S.gems+=g;S.gold+=o;track('afk');rareDrop(null,n);
  S.afkT=n>=AFK_MAX?Date.now():S.afkT+n*AFK_MS;
  save();render();toast(`Farm auto : ${n} victoire${n>1?'s':''} à l’étage ${S.best}, +${g} cristaux et +${o} or.`);
}

/* ---------- Entraînement ---------- */
const TRAIN_MAX=5,TRAIN_UNLOCK={3:2000,4:5000};
const inTrain=id=>!!(S&&S.train&&S.train.some(e=>e.id===id));
function removeTrain(id){if(S.train)S.train=S.train.filter(e=>e.id!==id)}
const trainRate=()=>(6+Math.floor(S.best/5))*(evBonus('train')?2:1);
function topLevel(ex){const l=S.heroes.filter(h=>!inTrain(h.id)&&h.id!==ex).map(h=>h.lvl);return l.length?Math.max(...l):0}
function trainLimit(h){return Math.min(capOf(h),Math.max(h.lvl,topLevel(h.id)))}
function tickTrain(){
  if(!S||!S.train)return;
  const now=Date.now(),rate=trainRate();
  S.train=S.train.filter(e=>heroById(e.id));
  S.train.forEach(e=>{
    const h=heroById(e.id),m=Math.floor((now-e.t)/60000);if(m<1)return;
    e.t+=m*60000;
    const mx=stats(h).hp;h.hp=Math.min(mx,h.hp+Math.ceil(mx*.03*m));
    const lim=trainLimit(h);
    if(h.lvl>=lim){h.xp=0;return}
    h.xp+=m*rate;
    while(h.lvl<lim&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);levelUp(h)}
    if(h.lvl>=lim)h.xp=0;
  });
}
function addTrain(id){
  const h=heroById(id);if(!h)return;
  if(busy)return toast('Attendez la fin du combat.');
  if(inTrain(id))return;
  if(S.train.length>=S.trainSlots)return toast('Tous les emplacements sont occupés.');
  removeFromTeam(id);if(selHero===id)selHero=null;
  S.train.push({id,t:Date.now(),from:h.lvl});track('train');
  save();render();toast(`${h.name} part s’entraîner.`);
}
function leaveTrain(id){
  tickTrain();const e=S.train.find(x=>x.id===id),h=heroById(id);if(!e||!h)return;
  removeTrain(id);save();render();

function unlockTrain(){

function ascend(id){
